# Quick Test Configuration
# A simplified version of the comprehensive config for quick testing

name: "quick_alignment_test"
description: "Quick test of alignment framework"

# Model
model_name: "resnet18"
model_config:
  num_classes: 10
  pretrained: false

# Dataset  
dataset_name: "mnist"
dataset_config:
  data_path: "./data"

# Training (minimal for testing)
training_config:
  epochs: 2
  batch_size: 64
  learning_rate: 0.001
  optimizer: "adam"

# Metrics (just a few key ones)
alignment_metrics:
  - "rayleigh_quotient"
  - "weight_cosine_similarity"

# Pruning
pruning_strategy: "magnitude"
pruning_config:
  amount: 0.3

# Workflow
train_model: true
compute_initial_metrics: true
apply_pruning: true
fine_tune_after_pruning: true
fine_tune_epochs: 1

# Resources
device: "cuda"
seed: 42

# Paths
checkpoint_dir: "./checkpoints"
log_dir: "./logs" 