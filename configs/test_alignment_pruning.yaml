# Test configuration for alignment pruning on MNIST MLP
experiment_name: "test_alignment_pruning"
experiment_type: "general_alignment"

# Random seed for reproducibility
seed: 42

# Device configuration
device: "cuda"

# Data configuration
data:
  dataset: "mnist"
  batch_size: 128
  num_workers: 4

# Model configuration
model:
  architecture: "mlp"
  hidden_sizes: [512, 256]
  activation: "relu"
  dropout_rate: 0.0  # No dropout for cleaner testing

# Training configuration - short training for quick testing
training:
  do_train: true
  epochs: 20
  optimizer:
    type: "adam"
    learning_rate: 0.001

# Analysis configuration
analysis:
  compute_metrics: true
  metrics: ["rayleigh_quotient", "gradient_similarity"]
  
# Pruning configuration - ONLY alignment pruning
pruning:
  enabled: true
  algorithms: ["alignment"]  # Only test alignment pruning
  selection_mode: "low"  # Prune neurons with low alignment
  sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]  # Test various sparsity levels
  alignment_metric: "rayleigh_quotient"  # Which alignment metric to use
  scope: "layer"  # Layer-wise pruning
  fine_tune_after_pruning: true
  fine_tune_epochs: 10

# Output configuration
output:
  save_results: true
  save_checkpoints: false
  generate_plots: true
