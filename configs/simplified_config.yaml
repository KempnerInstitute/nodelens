# Simplified Configuration for Alignment Analysis
# Only essential parameters - see unified_config.yaml for all options

# ==============================================================================
# EXPERIMENT SETUP
# ==============================================================================
experiment_name: "alignment_pruning_analysis"
experiment_type: "general_alignment"  # Main experiment type
seed: 42
device: "cuda"

# Output settings
output_dir: "./results"
save_checkpoints: false  # Set to true if you want model checkpoints

# ==============================================================================
# MODEL & DATA
# ==============================================================================
# Model architecture
model:
  name: "mlp"  # Options: mlp, cnn, resnet18, vgg16, etc.
  hidden_sizes: [512, 256, 128]  # For MLP
  activation: "relu"

# Dataset
dataset:
  name: "mnist"  # Options: mnist, cifar10, cifar100, etc.
  batch_size: 128
  num_workers: 4

# ==============================================================================
# TRAINING
# ==============================================================================
training:
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"  # Options: none, step, cosine, etc.

# ==============================================================================
# ALIGNMENT METRICS
# ==============================================================================
alignment:
  metrics: ["rayleigh_quotient"]  # Main metric to track
  compute_frequency: 5  # Compute every N epochs

# ==============================================================================
# PRUNING EXPERIMENTS
# ==============================================================================
pruning:
  # What pruning methods to compare
  strategies: ["magnitude", "alignment", "random"]
  
  # Sparsity levels to test (fraction of weights to remove)
  sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  
  # For alignment-based pruning
  alignment_metric: "rayleigh_quotient"
  pruning_mode: "low"  # Options: low (prune poorly aligned), high, random
  
  # Fine-tuning after pruning
  fine_tune: true
  fine_tune_epochs: 10

# ==============================================================================
# MULTI-NETWORK EXPERIMENTS (Optional)
# ==============================================================================
multi_network:
  num_networks: 1  # Set > 1 for statistical analysis across seeds
  
# ==============================================================================
# VISUALIZATION
# ==============================================================================
visualization:
  generate_plots: true
  save_results: true 