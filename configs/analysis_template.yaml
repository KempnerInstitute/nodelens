# Analysis Configuration Template
# Use this file to configure analysis and visualization generation.
#
# Run analysis with:
#   python -m alignment.analysis.analysis_runner --config configs/analysis_template.yaml
#
# Or programmatically:
#   from alignment.analysis import AnalysisRunner
#   runner = AnalysisRunner("configs/analysis_template.yaml")
#   runner.run()

# Input sources (specify at least one)
results_dir: "./results"           # Directory containing experiment result JSONs
# results_file: "./results/experiment.json"  # Single result file
# importance_scores_file: "./results/scores.pt"  # Pre-computed scores

# Output configuration
output_dir: "./analysis_output"

# Visualization style
style: "seaborn-v0_8-paper"
figsize: [10, 6]
dpi: 300
format: "png"  # png, pdf, svg

# Which analyses to run
# Options: all, histograms, scatter_plots, heatmaps, layer_distributions, pruning_curves, scar_analysis
analyses:
  - all

# Per-analysis configuration
histograms:
  bins: 100
  top_k: 5  # Number of top neurons to annotate
  metrics: null  # null = all available, or list: ["rayleigh_quotient", "activation_l2_norm"]
  layers: null   # null = all available, or list: ["layer1", "layer2"]

scatter_plots:
  alpha: 0.5
  point_size: 10
  pairs:
    - ["activation_l2_norm", "rayleigh_quotient"]
    - ["activation_variance", "rayleigh_quotient"]
    - ["rayleigh_quotient", "pairwise_redundancy_gaussian"]

heatmaps:
  metrics: null  # null = all available

layer_distributions:
  plot_type: "violin"  # violin, box, strip
  metrics: null        # null = all available

pruning_curves:
  show_baseline: true

scar_analysis:
  plot_type: "violin"
  metrics:
    - scar_loss_proxy
    - scar_activation_power
    - scar_taylor
    - scar_curvature

# Advanced pruning analysis (uses specialized PruningVisualizer)
# Not included in "all" - must be explicitly requested
advanced_pruning:
  metric_mapping:
    activation_outlier_index: "Outlier Index (OI)"
    scar_taylor: "Taylor Saliency (T)"
    scar_curvature: "Curvature (R)"
    rayleigh_quotient: "Rayleigh Quotient"

