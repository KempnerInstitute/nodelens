# LLM Layer Analysis Configuration
# Replaces: scripts/generate_llm_layer_figures.py
#
# Usage:
#   python scripts/run_analysis.py --config configs/analysis/llm_layer_analysis.yaml

results_dir: "./results"
output_dir: "./llm_layer_plots"
style: "seaborn-v0_8-paper"
figsize: [10, 6]
dpi: 300
format: "png"

analyses:
  - histograms
  - scatter_plots
  - layer_distributions

histograms:
  bins: 100
  top_k: 10
  metrics:
    - activation_l2_norm
    - activation_variance
    - rayleigh_quotient
    - mutual_information_gaussian

scatter_plots:
  alpha: 0.5
  point_size: 10
  pairs:
    - ["activation_l2_norm", "rayleigh_quotient"]
    - ["activation_l2_norm", "mutual_information_gaussian"]
    - ["rayleigh_quotient", "pairwise_redundancy_gaussian"]

layer_distributions:
  plot_type: "violin"
  metrics:
    - activation_l2_norm
    - rayleigh_quotient

