# Example: Alignment-based Pruning
# This demonstrates pruning based on neuron-input alignment metrics
experiment_name: "alignment_based_pruning"
experiment_type: "standard_pruning"

# Dataset and model
dataset:
  name: "mnist"
  batch_size: 128

model:
  name: "mlp"
  output_dim: 10
  mlp_config:
    input_dim: 784
    hidden_dims: [512, 256, 128]

# Training
training:
  epochs: 10

# Alignment metrics
alignment:
  metrics: ["rayleigh_quotient"]

# Pruning configuration
pruning:
  # Algorithm options:
  # - "magnitude": Traditional weight magnitude
  # - "alignment" or "rayleigh_quotient": Neuron-input alignment  
  # - "hybrid": Combine magnitude (50%) and alignment (50%)
  algorithms: ["magnitude", "alignment", "hybrid"]
  
  # Which weights to prune based on importance
  selection_mode: "low"  # Prune neurons with low alignment
  
  # Test at different sparsity levels
  sparsity_levels: [0.3, 0.5, 0.7]
  
  # Fine-tuning
  fine_tune_after_pruning: true
  fine_tune_epochs: 5

# Visualization
visualization:
  generate_plots: true 