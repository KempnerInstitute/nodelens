# Simple test configuration for comprehensive alignment experiment

name: "simple_test_alignment"
description: "Simple test run"
tags:
  - "test"

# Model configuration
model_name: "resnet18"
model_config:
  num_classes: 10
  pretrained: false

# Dataset configuration  
dataset_name: "mnist"  # Using MNIST as it's simpler
dataset_config:
  data_path: "./data"

# Training configuration (minimal)
training_config:
  epochs: 2
  batch_size: 128
  learning_rate: 0.001
  optimizer: "adam"

# Alignment metrics
alignment_metrics:
  - "rayleigh_quotient"
  - "weight_cosine_similarity"

metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
    aggregation_op: "mean"

# Pruning configuration
pruning_strategy: "magnitude"
pruning_config:
  amount: 0.5
  structured: false

# Experiment workflow
train_model: true
compute_initial_metrics: true
apply_pruning: true
fine_tune_after_pruning: true
fine_tune_epochs: 1

# Analysis & tracking
track_performance: true
save_metrics_history: true
save_checkpoints: true
checkpoint_dir: "./checkpoints"
save_best: true

# Computational resources
device: "cuda"
num_workers: 4
seed: 42

# Logging & visualization
log_dir: "./logs"
verbose: true

# Disable HTML report
generate_html_report: false

# Visualization options
generate_plots: true
save_raw_data: true

# No distributed training
distributed: false 