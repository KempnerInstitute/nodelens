# Example configuration for layer-isolated pruning experiment
# Each layer is pruned independently based on its own alignment scores

name: layer_isolated_pruning_experiment
description: "Layer-isolated pruning where each layer is pruned independently"
tags: [pruning, layer_isolated, alignment]
seed: 42

# ============================================================================
# PRUNING EXPERIMENT CONFIGURATION
# ============================================================================
# Type of pruning experiment
pruning_experiment: layer_isolated

# Dropout rates to evaluate
dropout_rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]

# Pruning modes to evaluate
pruning_modes: [low, high, random]

# Number of random trials for averaging
num_random_trials: 3

# Exclude classification layer from pruning
exclude_classification_layer: true

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model_name: resnet18
model_config:
  num_classes: 10
  pretrained: false

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset_name: cifar10
dataset_config:
  data_path: ./data

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training_config:
  epochs: 20
  batch_size: 128
  learning_rate: 0.1
  optimizer: sgd
  optimizer_kwargs:
    momentum: 0.9
    weight_decay: 0.0001
  scheduler: cosine
  scheduler_kwargs:
    T_max: 20
    eta_min: 0.001
  device: cuda

# ============================================================================
# ALIGNMENT METRICS
# ============================================================================
alignment_metrics:
  - rayleigh_quotient  # Used for pruning importance scores
  - weight_cosine_similarity
  - mutual_information

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================
analysis_config:
  generate_plots: true
  plot_dpi: 300
  generate_html_report: true

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
checkpoint_dir: ./checkpoints
log_dir: ./logs
output_dir: ./results

use_timestamp: true
timestamp_format: "%Y%m%d_%H%M%S"
verbose: true

# ============================================================================
# USAGE
# ============================================================================
# Simply run:
# python unified_experiment.py --config configs/example_layer_isolated_pruning.yaml
#
# The experiment will:
# 1. Train the model for 20 epochs
# 2. Compute alignment scores for each layer independently
# 3. Prune each layer based on its own scores
# 4. Evaluate at each dropout rate with low/high/random modes
# 5. Generate comprehensive visualizations and reports 