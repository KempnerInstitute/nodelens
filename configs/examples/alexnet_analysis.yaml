# AlexNet Analysis Configuration
# Fixed configuration for torchvision AlexNet experiments
name: "alexnet_alignment_analysis"
description: "AlexNet alignment analysis with pruning experiments"
tags: ["alexnet", "torchvision", "alignment", "pruning"]

# Experiment settings
seed: 42
device: "cuda"

# Dataset configuration
dataset_name: "cifar10"
data_path: "./data"
batch_size: 128
num_workers: 4
dataset_config:
  download: true
  normalize: true
  augmentation: false

# Model configuration - Using torchvision_model loader
model_name: "torchvision_model"
model_config:
  model_name: "alexnet"
  pretrained: true
  num_classes: 10  # CIFAR-10 classes
pretrained: true

# Training configuration
train_before_dropout: true
training_epochs: 10
learning_rate: 0.001
optimizer: "adam"

# Metrics configuration
metrics: ["rayleigh_quotient", "mutual_information_gaussian"]
metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
  mutual_information_gaussian:
    bins: 50

# Layer tracking - AlexNet specific layers
tracked_layers:
  - "features.0"   # conv1: Conv2d(3, 64, kernel_size=11, stride=4, padding=2)
  - "features.3"   # conv2: Conv2d(64, 192, kernel_size=5, stride=1, padding=2)
  - "features.6"   # conv3: Conv2d(192, 384, kernel_size=3, stride=1, padding=1)
  - "features.8"   # conv4: Conv2d(384, 256, kernel_size=3, stride=1, padding=1)
  - "features.10"  # conv5: Conv2d(256, 256, kernel_size=3, stride=1, padding=1)
  - "classifier.1" # fc1: Linear(9216, 4096)
  - "classifier.4" # fc2: Linear(4096, 4096)
  - "classifier.6" # fc3: Linear(4096, num_classes)

# CNN-specific settings
scale_by_norm: false
force_cpu_for_large_metric_ops: true
cnn_rq_aggregation_op: "mean"
exclude_classification_layer: true


