# LLaMA-3 Pruning Example
# Redundancy-aware pruning of LLaMA-3 model

experiment:
  name: "llama3_redundancy_aware_pruning"
  seed: 42
  device: "cuda"
  output_dir: "./results/llama3_pruning"

model:
  name: "meta-llama/Meta-Llama-3-8B"
  pretrained: true
  tracked_layers: null  # Auto-detect FFN and attention layers

dataset:
  name: "wikitext"
  data_path: "./data"
  batch_size: 4
  num_workers: 2
  max_length: 512

metrics:
  enabled: ['rayleigh_quotient', 'pairwise_redundancy_gaussian', 'synergy_gaussian_mmi']
  
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6
  
  pairwise_redundancy_gaussian:
    mode: 'output_based'  # Required for efficiency on LLMs
    num_pairs: 20
  
  synergy_gaussian_mmi:
    num_pairs: 10

pruning:
  enabled: true
  strategy: 'ultimate'  # Multi-stage: magnitude -> alignment -> composite
  target_sparsity: 0.3  # Prune 30% of neurons (conservative for LLMs)
  distribution: 'adaptive_sensitivity'  # Per-layer amounts based on importance
  scoring: 'composite'  # Redundancy-aware: RQ + redundancy + synergy
  direction: 'low'  # Prune low-importance neurons
  structured: true  # Neuron-level pruning
  dependency_aware: true  # Handle FFN up_proj <-> down_proj dependencies
  
  fine_tune:
    enabled: true
    epochs: 5  # Short fine-tuning for LLMs
    learning_rate: 1.0e-5  # Low LR for fine-tuning
  
  composite_weights:
    alpha_mi: 0.0
    beta_synergy: 0.3
    gamma_redundancy: 0.4  # Remove redundant neurons
    delta_rq: 0.3

layer_config:
  transformer:
    track_qkv: true
    aggregation: 'sequence_mean'

evaluation:
  task: 'language_modeling'  # Use perplexity for LLMs
  metrics: ['perplexity', 'loss']

# Run with: python scripts/run_experiment.py --config configs/examples/llama3_pruning.yaml

