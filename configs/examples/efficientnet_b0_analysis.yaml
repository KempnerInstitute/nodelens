# EfficientNet-B0 Analysis Configuration
# EfficientNet-B0 configuration for alignment experiments
name: "efficientnet_b0_alignment_analysis"
description: "EfficientNet-B0 alignment analysis with pruning experiments"
tags: ["efficientnet", "torchvision", "alignment", "pruning", "efficient"]

# Experiment settings
seed: 42
device: "cuda"

# Dataset configuration
dataset_name: "cifar10"
data_path: "./data"
batch_size: 128
num_workers: 4
dataset_config:
  download: true
  normalize: true
  augmentation: true

# Model configuration - Using torchvision_model loader
model_name: "torchvision_model"
model_config:
  model_name: "efficientnet_b0"
  pretrained: true
  num_classes: 10  # CIFAR-10 classes
pretrained: true

# Training configuration
train_before_dropout: true
training_epochs: 15
learning_rate: 0.0001
optimizer: "adamw"  # EfficientNet works well with AdamW

# Metrics configuration
metrics: ["rayleigh_quotient", "mutual_information_gaussian"]
metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
  mutual_information_gaussian:
    bins: 50

# Layer tracking - EfficientNet-B0 key layers
tracked_layers:
  - "features.0.0"     # Initial conv: Conv2d(3, 32, kernel_size=3, stride=2, padding=1)
  - "features.1.0.conv.0.0"  # MBConv block 1 conv1
  - "features.1.0.conv.1.0"  # MBConv block 1 depthwise
  - "features.1.0.conv.2.0"  # MBConv block 1 pointwise
  - "features.2.0.conv.0.0"  # MBConv block 2 conv1
  - "features.2.0.conv.1.0"  # MBConv block 2 depthwise
  - "features.2.0.conv.2.0"  # MBConv block 2 pointwise
  - "features.3.0.conv.0.0"  # MBConv block 3 conv1
  - "features.4.0.conv.0.0"  # MBConv block 4 conv1
  - "features.5.0.conv.0.0"  # MBConv block 5 conv1
  - "features.6.0.conv.0.0"  # MBConv block 6 conv1
  - "features.7.0.conv.0.0"  # MBConv block 7 conv1
  - "features.8.0"     # Final conv: Conv2d(320, 1280, kernel_size=1)
  - "classifier.1"     # Final classifier: Linear(1280, num_classes)

# CNN-specific settings
scale_by_norm: false
force_cpu_for_large_metric_ops: true
cnn_rq_aggregation_op: "mean"
exclude_classification_layer: true
