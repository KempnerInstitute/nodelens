experiment:
  name: "llama3_alignment_analysis"
  description: "LLM alignment and pruning experiment for Meta-Llama-3"
  tags: ["llm", "alignment", "pruning"]
  device: "cuda"
  batch_size: 1
  num_workers: 0
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  do_train: false

model:
  name: "hf_causal_lm"
  model_id: "meta-llama/Llama-3.1-8B"
  torch_dtype: "bfloat16"
  # pretrained: true

dataset:
  dataset_name: "wikitext-2-v1"
  split: "test"
  # data_path: "./data"

alignment:
  metrics:
    - "activation_l2_norm"

pruning:
  enabled: true
  # algorithms: # not implemented yet
  #   - "alignment"
  alignment_metric: "activation_l2_norm"
  sparsity_levels: [0.1, 0.3, 0.5]
  mode: "high" 

evaluation:
  compute_perplexity: true
  dataset: "wikitext"
  num_samples: 20

importance_computation:
  num_samples: 1

wrapper:
  name: "transformer_wrapper"
  tracked_layer_patterns:
    - "model.layers.*.mlp.gate_proj"
    - "model.layers.*.mlp.up_proj"
    - "model.layers.*.mlp.down_proj"

logging:
  log_interval: 50


