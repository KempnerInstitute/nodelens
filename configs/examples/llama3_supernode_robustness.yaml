# ============================================================================
# LLaMA-3 SUPERNODE ROBUSTNESS ANALYSIS
# ============================================================================
# 
# PURPOSE: Analyze the robustness and consistency of supernode identification
# 
# This config focuses on answering:
# 1. Are supernodes consistent across different metrics (RQ, MI, SCAR, magnitude)?
# 2. Are supernodes consistent across different data batches?
# 3. Which neurons are "truly" important (robust supernodes)?
#
# Key outputs:
# - Jaccard similarity between supernode sets from different metrics
# - Spearman correlation between importance rankings
# - Bootstrap stability scores per neuron
# - Visualizations showing cross-metric and cross-batch consistency
#
# EXPECTED RUNTIME: ~30-60 minutes on H100
# ============================================================================

experiment:
  name: "llama3_supernode_robustness"
  type: "llm_alignment"
  seed: 42
  device: "cuda"
  output_dir: "./results/llama3_supernode_robustness"
  num_networks: 1

model:
  name: "hf_causal_lm"
  model_id: "meta-llama/Llama-3.1-8B"
  dtype: "bfloat16"
  device_map: "auto"
  
  # Track all MLP layers
  tracked_layers:
    - "model.model.layers.*.mlp.up_proj"
    - "model.model.layers.*.mlp.gate_proj"
    - "model.model.layers.*.mlp.down_proj"

dataset:
  name: "wikitext"
  batch_size: 1
  num_workers: 0

# ============================================================================
# IMPORTANCE METRICS
# ============================================================================
metrics:
  enabled:
    - "rayleigh_quotient"
    - "gaussian_mi_analytic"
    - "activation_l2_norm"
  
  num_samples: 64
  
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6

# ============================================================================
# LLM-SPECIFIC SETTINGS
# ============================================================================
llm:
  # Enable SCAR metrics for robustness comparison
  scar_metrics: true
  scar_num_samples: 64
  scar_max_length: 512
  
  # Minimal evaluation (focus is on supernode analysis)
  evaluate_perplexity: true
  evaluation_num_samples: 50
  
  evaluation_metrics:
    - "perplexity"
    - "loss"

# ============================================================================
# SUPERNODE CONFIGURATION
# ============================================================================
supernode:
  enabled: true
  
  core_fraction: 0.01         # Top 1% = supernodes
  follower_fraction: 0.10
  score_metric: "scar_activation_power"
  
  protect_core: true
  cross_layer_analysis: true
  compare_by_connection: true
  
  compute_metrics:
    - "activation"
    - "rayleigh_quotient"
    - "mutual_information"
    - "redundancy"

# ============================================================================
# SUPERNODE ROBUSTNESS ANALYSIS - Main focus of this config
# ============================================================================
supernode_robustness:
  enabled: true
  
  # Supernode fraction for comparison
  supernode_fraction: 0.01    # Top 1%
  
  # Bootstrap analysis for batch consistency
  num_bootstrap_samples: 10   # 10 bootstrap resamples
  batch_size: 16              # Smaller batch for memory
  max_samples: 128            # Fewer samples for faster testing
  
  # Metrics to compare for cross-metric consistency
  metrics:
    - "scar_activation_power"   # Raw activation power
    - "scar_loss_proxy"         # Combined activation + curvature
    - "scar_taylor"             # First-order gradient term
    - "rayleigh_quotient"       # Alignment measure
    - "gaussian_mi_analytic"    # Mutual information
    - "activation_l2_norm"      # Simple magnitude
  
  # Focus on specific layers for detailed analysis
  # (null = analyze all layers, which is expensive)
  target_layers:
    - "model.layers.5"          # Early layer
    - "model.layers.15"         # Middle layer
    - "model.layers.25"         # Late layer

# ============================================================================
# PRUNING - Minimal (focus is on robustness analysis)
# ============================================================================
pruning:
  enabled: true
  
  # Just a few sparsity levels to see effect of robustness
  sparsity_levels: [0.3, 0.5, 0.7]
  selection_modes: ["low"]
  
  distribution: "uniform"
  structured: true
  
  # Compare a few key algorithms
  algorithms:
    - "rayleigh_quotient"
    - "scar_loss_proxy"
    - "activation_l2_norm"

# ============================================================================
# ADVANCED ANALYSIS FLAGS
# ============================================================================
do_directed_redundancy: true
do_connectivity_pruning: true

# ============================================================================
# ANALYSIS & VISUALIZATION
# ============================================================================
analysis:
  save_scores: true
  generate_plots: true
  
  plots:
    histograms: true
    scatter_plots: true
    pruning_curves: true

visualization:
  format: "png"
  dpi: 300

# ============================================================================
# EXPECTED OUTPUT STRUCTURE
# ============================================================================
# results/llama3_supernode_robustness_YYYYMMDD_HHMMSS/
# ├── experiment_config.yaml
# ├── results_YYYYMMDD_HHMMSS.json
# ├── experiment.log
# ├── plots/
# |   ├── supernode_robustness/
# |   |   ├── jaccard_heatmap_layer5.png       # Metric overlap
# |   |   ├── jaccard_heatmap_layer15.png
# |   |   ├── jaccard_heatmap_layer25.png
# |   |   ├── spearman_heatmap_*.png           # Score correlations
# |   |   ├── bootstrap_stability_*.png        # Per-neuron stability
# |   |   ├── consistency_bars_*.png           # Cross-metric consistency
# |   |   └── score_scatter_matrix_*.png       # Metric pairwise scatter
# |   ├── supernode/
# |   ├── scar/
# |   └── pruning/
# └── checkpoints/


