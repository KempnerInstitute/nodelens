# |   |   ├── jaccard_heatmap_*.png          # Metric overlap heatmaps
# |   |   ├── spearman_heatmap_*.png         # Score correlation heatmaps
# |   |   ├── bootstrap_stability_*.png      # Per-neuron stability
# |   |   ├── consistency_bars_*.png         # Cross-metric consistency
