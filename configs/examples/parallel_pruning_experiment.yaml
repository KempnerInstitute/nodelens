# Parallel Pruning Experiment Configuration
# Trains multiple networks simultaneously for statistical analysis

experiment_name: "parallel_pruning_analysis"
experiment_type: "parallel_pruning"

# Number of networks to train in parallel
num_networks: 5

# Seeds for reproducibility
seeds: [42, 43, 44, 45, 46]

# Dataset
dataset_name: "mnist"
batch_size: 128

# Model Configuration
model_class: "mlp"
model_kwargs:
  input_dim: 784
  hidden_sizes: [512, 256, 128]
  output_dim: 10
  activation: "relu"

# Training
epochs: 20
learning_rate: 0.001
device: "cuda"

# Alignment Metrics
metrics_to_compute:
  - "rayleigh_quotient"
  - "mutual_information_gaussian"

# Pruning Configuration
pruning_strategies: ["magnitude", "alignment", "random"]
pruning_modes: ["low", "high"]
sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
fine_tune_epochs: 5

# Output
output_dir: "results/parallel_pruning"
create_visualizations: true
