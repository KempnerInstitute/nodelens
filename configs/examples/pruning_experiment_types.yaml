# Example: Different Pruning Experiment Types
# This shows how to use the three different pruning experiment patterns

# =============================================================================
# Option 1: Standard Pruning (all layers at once)
# =============================================================================
# experiment_type: "standard_pruning"
# 
# pruning:
#   algorithms: ["magnitude", "alignment"]
#   structured: true  # Prune entire neurons
#   selection_mode: "low"
#   sparsity_levels: [0.3, 0.5, 0.7]
#   alignment_metric: "rayleigh_quotient"

# =============================================================================
# Option 2: Layer-Isolated Pruning (one layer at a time)
# =============================================================================
# experiment_type: "layer_isolated_pruning"
# 
# # Note: Different parameter names!
# dropout_rates: [0.3, 0.5, 0.7]  # How much to prune
# pruning_metric: "rayleigh_quotient"  # Which metric to use
# pruning_strategy: "low"  # low/high/random
# exclude_classification_layer: true
# num_random_trials: 3

# =============================================================================
# Option 3: Cascading Layer Pruning (sequential, cumulative)
# =============================================================================
experiment_type: "cascading_layer_pruning"

# Cascading-specific settings
cascade_direction: "forward"  # Start from input layers
recompute_scores: true  # Recompute after each layer
dropout_rates: [0.3, 0.5, 0.7]
pruning_metric: "rayleigh_quotient"
pruning_strategy: "low"

# Common settings for all types
experiment_name: "pruning_patterns_comparison"
device: "cuda"
seed: 42

dataset:
  name: "mnist"
  batch_size: 128

model:
  name: "mlp"
  output_dim: 10
  mlp_config:
    input_dim: 784
    hidden_dims: [512, 256, 128]

training:
  epochs: 10
  optimizer: "adam"
  learning_rate: 0.001

# Visualization
visualization:
  generate_plots: true

# =============================================================================
# Key Differences:
# =============================================================================
# 1. Standard Pruning:
#    - Prunes all layers simultaneously
#    - Each layer pruned independently based on its scores
#    - Most common approach
#
# 2. Layer-Isolated:
#    - Prune layer 1 → evaluate → restore
#    - Prune layer 2 → evaluate → restore
#    - Shows individual layer importance
#
# 3. Cascading:
#    - Prune layer 1 → keep pruned
#    - Prune layer 2 (with layer 1 still pruned) → keep both pruned
#    - Shows cumulative effects
#
# Note: These use different parameter names!
# - Standard: uses 'pruning' section with 'sparsity_levels'
# - Layer-isolated/Cascading: use 'dropout_rates' directly 