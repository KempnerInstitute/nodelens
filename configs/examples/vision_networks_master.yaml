# Master Configuration for Vision Network Experiments
# This file demonstrates how to configure various vision models for alignment experiments
name: "vision_networks_master"
description: "Master configuration showcasing all supported vision networks"
tags: ["vision", "torchvision", "timm", "alignment", "pruning", "master"]

# ============================================================================
# EXPERIMENT SETTINGS
# ============================================================================
seed: 42
device: "cuda"

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset_name: "cifar10"  # Options: "mnist", "cifar10", "cifar100", "imagenet"
data_path: "./data"
batch_size: 128
num_workers: 4
dataset_config:
  download: true
  normalize: true
  augmentation: true

# ============================================================================
# MODEL CONFIGURATION OPTIONS
# ============================================================================
# Choose ONE of the following model configurations by uncommenting:

# --- TORCHVISION MODELS ---
# AlexNet
# model_name: "torchvision_model"
# model_config:
#   model_name: "alexnet"
#   pretrained: true
#   num_classes: 10

# ResNet-18 (Lightweight)
model_name: "torchvision_model"
model_config:
  model_name: "resnet18"
  pretrained: true
  num_classes: 10

# ResNet-50 (Standard)
# model_name: "torchvision_model"
# model_config:
#   model_name: "resnet50"
#   pretrained: true
#   num_classes: 10

# VGG-16
# model_name: "torchvision_model"
# model_config:
#   model_name: "vgg16"
#   pretrained: true
#   num_classes: 10

# EfficientNet-B0
# model_name: "torchvision_model"
# model_config:
#   model_name: "efficientnet_b0"
#   pretrained: true
#   num_classes: 10

# MobileNet-V2
# model_name: "torchvision_model"
# model_config:
#   model_name: "mobilenet_v2"
#   pretrained: true
#   num_classes: 10

# --- TIMM MODELS ---
# Vision Transformer Base/16
# model_name: "timm_model"
# model_config:
#   model_name: "vit_base_patch16_224"
#   pretrained: true
#   num_classes: 10
#   img_size: 224

# Vision Transformer Small/16
# model_name: "timm_model"
# model_config:
#   model_name: "vit_small_patch16_224"
#   pretrained: true
#   num_classes: 10
#   img_size: 224

# DeiT Base
# model_name: "timm_model"
# model_config:
#   model_name: "deit_base_patch16_224"
#   pretrained: true
#   num_classes: 10
#   img_size: 224

# Swin Transformer Tiny
# model_name: "timm_model"
# model_config:
#   model_name: "swin_tiny_patch4_window7_224"
#   pretrained: true
#   num_classes: 10
#   img_size: 224

pretrained: true

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
train_before_dropout: true
training_epochs: 10
learning_rate: 0.001  # Adjust based on model: lower for pretrained (0.0001-0.00001)
optimizer: "adam"     # Options: "adam", "adamw", "sgd"

# ============================================================================
# METRICS CONFIGURATION
# ============================================================================
metrics: ["rayleigh_quotient", "mutual_information_gaussian"]
metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
  mutual_information_gaussian:
    bins: 50

# ============================================================================
# LAYER TRACKING CONFIGURATIONS
# ============================================================================
# Choose the appropriate tracked_layers based on your model:

# ResNet-18 layers
tracked_layers:
  - "conv1"
  - "layer1.0.conv1"
  - "layer1.0.conv2"
  - "layer2.0.conv1"
  - "layer2.0.conv2"
  - "layer3.0.conv1"
  - "layer3.0.conv2"
  - "layer4.0.conv1"
  - "layer4.0.conv2"
  - "fc"

# AlexNet layers
# tracked_layers:
#   - "features.0"   # conv1
#   - "features.3"   # conv2
#   - "features.6"   # conv3
#   - "features.8"   # conv4
#   - "features.10"  # conv5
#   - "classifier.1" # fc1
#   - "classifier.4" # fc2
#   - "classifier.6" # fc3

# VGG-16 layers
# tracked_layers:
#   - "features.0"   # conv1_1
#   - "features.2"   # conv1_2
#   - "features.5"   # conv2_1
#   - "features.7"   # conv2_2
#   - "features.10"  # conv3_1
#   - "features.17"  # conv4_1
#   - "features.24"  # conv5_1
#   - "classifier.0" # fc1
#   - "classifier.3" # fc2
#   - "classifier.6" # fc3

# Vision Transformer layers
# tracked_layers:
#   - "patch_embed.proj"
#   - "blocks.0.attn.qkv"
#   - "blocks.0.mlp.fc1"
#   - "blocks.3.attn.qkv"
#   - "blocks.6.attn.qkv"
#   - "blocks.9.attn.qkv"
#   - "blocks.11.attn.qkv"
#   - "head"

# ============================================================================
# CNN/TRANSFORMER-SPECIFIC SETTINGS
# ============================================================================
scale_by_norm: false
force_cpu_for_large_metric_ops: true
cnn_rq_aggregation_op: "mean"
exclude_classification_layer: true

# ============================================================================
# PRUNING CONFIGURATION (Optional)
# ============================================================================
# Uncomment to enable pruning experiments:
# pruning:
#   enabled: true
#   algorithms: ["alignment", "magnitude", "random"]
#   sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
#   selection_modes: ["low", "high"]
#   alignment_metric: "rayleigh_quotient"
#   fine_tune_after_pruning: true
#   fine_tune_epochs: 5

# ============================================================================
# CHECKPOINTING AND LOGGING
# ============================================================================
checkpoint_dir: "./checkpoints"
checkpoint_interval: 1000
save_best: true
log_dir: "./logs"
log_interval: 100

# ============================================================================
# NOTES AND RECOMMENDATIONS
# ============================================================================
# 1. For ImageNet experiments, use batch_size: 32-64 and more epochs
# 2. For transformer models, consider using AdamW optimizer
# 3. Adjust learning_rate based on model size and pretraining:
#    - Large pretrained models: 0.00001-0.0001
#    - Medium models: 0.0001-0.001
#    - Small models from scratch: 0.001-0.01
# 4. Vision transformers require input size 224x224
# 5. Some models may require specific preprocessing - check model documentation
