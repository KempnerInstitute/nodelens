# VGG-16 Analysis Configuration
# VGG-16 configuration for alignment experiments
name: "vgg16_alignment_analysis"
description: "VGG-16 alignment analysis with pruning experiments"
tags: ["vgg16", "torchvision", "alignment", "pruning"]

# Experiment settings
seed: 42
device: "cuda"

# Dataset configuration
dataset_name: "cifar10"
data_path: "./data"
batch_size: 128
num_workers: 4
dataset_config:
  download: true
  normalize: true
  augmentation: true

# Model configuration - Using torchvision_model loader
model_name: "torchvision_model"
model_config:
  model_name: "vgg16"
  pretrained: true
  num_classes: 10  # CIFAR-10 classes
pretrained: true

# Training configuration
train_before_dropout: true
training_epochs: 12
learning_rate: 0.0001  # Lower LR for pretrained model
optimizer: "adam"

# Metrics configuration
metrics: ["rayleigh_quotient", "mutual_information_gaussian"]
metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
  mutual_information_gaussian:
    bins: 50

# Layer tracking - VGG-16 key layers
tracked_layers:
  - "features.0"   # conv1_1: Conv2d(3, 64, kernel_size=3, padding=1)
  - "features.2"   # conv1_2: Conv2d(64, 64, kernel_size=3, padding=1)
  - "features.5"   # conv2_1: Conv2d(64, 128, kernel_size=3, padding=1)
  - "features.7"   # conv2_2: Conv2d(128, 128, kernel_size=3, padding=1)
  - "features.10"  # conv3_1: Conv2d(128, 256, kernel_size=3, padding=1)
  - "features.12"  # conv3_2: Conv2d(256, 256, kernel_size=3, padding=1)
  - "features.14"  # conv3_3: Conv2d(256, 256, kernel_size=3, padding=1)
  - "features.17"  # conv4_1: Conv2d(256, 512, kernel_size=3, padding=1)
  - "features.19"  # conv4_2: Conv2d(512, 512, kernel_size=3, padding=1)
  - "features.21"  # conv4_3: Conv2d(512, 512, kernel_size=3, padding=1)
  - "features.24"  # conv5_1: Conv2d(512, 512, kernel_size=3, padding=1)
  - "features.26"  # conv5_2: Conv2d(512, 512, kernel_size=3, padding=1)
  - "features.28"  # conv5_3: Conv2d(512, 512, kernel_size=3, padding=1)
  - "classifier.0" # fc1: Linear(512*7*7, 4096)
  - "classifier.3" # fc2: Linear(4096, 4096)
  - "classifier.6" # fc3: Linear(4096, num_classes)

# CNN-specific settings
scale_by_norm: false
force_cpu_for_large_metric_ops: true
cnn_rq_aggregation_op: "mean"
exclude_classification_layer: true
