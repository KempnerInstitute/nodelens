# LLaMA-3 Per-Neuron Scoring Example
# Compute importance scores for LLaMA-3 FFN neurons

experiment:
  name: "llama3_ffn_scoring"
  seed: 42
  device: "cuda"
  output_dir: "./results/llama3_scoring"

# model:
#   name: "meta-llama/Meta-Llama-3-8B"  # HuggingFace model ID
#   pretrained: true
#   tracked_layers: null  # Auto-detect all Linear layers in FFN/attention

# dataset:
#   name: "wikitext"  # Options: 'wikitext', 'c4'
#   data_path: "./data"
#   batch_size: 4  # Small batch for LLMs
#   num_workers: 2
#   max_length: 512  # Sequence length


model_name: hf_causal_lm
model_config:
  model_id: meta-llama/Llama-3.1-8B
  # pretrained: true
  # tracked_layers: null  # Auto-detect FFN and attention layers

dataset:
  name: "wikitext"
  tokenizer: "meta-llama/Llama-3.1-8B"
  # data_path: "./data"
  batch_size: 4
  num_workers: 2
  max_length: 512

