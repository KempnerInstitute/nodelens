# ============================================================================
# LLAMA-2-7B COMPREHENSIVE PRUNING COMPARISON
# ============================================================================
# Reference: https://arxiv.org/abs/2307.09288 (Llama 2)
# 
# PURPOSE: Extend SCAR evaluation to Llama-2-7B for comparison paper results
# 
# Llama-2-7B specs:
# - 32 layers, 4096 hidden dim, 11008 intermediate dim
# - Same SwiGLU MLP as Llama-3
# - Widely used baseline in pruning literature
#
# From SCAR paper Table 5 (Cross-Model Generalization at 50% sparsity):
# ┌─────────────────┬──────────────┬──────────────────┐
# | Model           | Method       | PPLdown  | Acc.up   |
# ├─────────────────┼──────────────┼───────┼─────────┤
# | Llama-2-7B      | Wanda        | 19.4  | 62.3%   |
# |                 | SCAR         | 13.1  | 66.8%   |
# └─────────────────┴──────────────┴───────┴─────────┘
#
# EXPECTED RUNTIME: ~6-10 hours on H100
# ============================================================================

experiment:
  name: "llama2_7b_pruning"
  type: "llm_alignment"
  seed: 42
  device: "cuda"
  output_dir: "./results/llama2_7b_pruning"
  num_networks: 1

model:
  name: "hf_causal_lm"
  model_id: "meta-llama/Llama-2-7b-hf"
  dtype: "bfloat16"
  device_map: "auto"
  
  # Llama-2 uses same MLP structure as Llama-3 (SwiGLU)
  tracked_layers:
    - "model.model.layers.*.mlp.up_proj"
    - "model.model.layers.*.mlp.gate_proj"
    - "model.model.layers.*.mlp.down_proj"

dataset:
  name: "wikitext"
  batch_size: 1
  num_workers: 0

# ============================================================================
# IMPORTANCE METRICS
# ============================================================================
metrics:
  enabled:
    - "rayleigh_quotient"
    - "gaussian_mi_analytic"
    - "average_redundancy"
    - "activation_l2_norm"
  
  num_samples: 64
  
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6

# ============================================================================
# LLM-SPECIFIC SETTINGS
# ============================================================================
llm:
  scar_metrics: true
  scar_num_samples: 64
  scar_max_length: 512
  
  evaluate_perplexity: true
  evaluation_num_samples: 200
  
  use_nvidia_fewshot: true
  use_chain_of_thought: true
  
  evaluation_metrics:
    - "perplexity"
    - "loss"
    - "accuracy_winogrande"
    - "accuracy_arc_challenge"
    - "accuracy_mmlu"
    - "accuracy_hellaswag"
    - "accuracy_arc_easy"
    - "accuracy_piqa"
    - "accuracy_boolq"

# ============================================================================
# SUPERNODE CONFIGURATION
# ============================================================================
supernode:
  enabled: true
  core_fraction: 0.01
  follower_fraction: 0.10
  score_metric: "activation_l2_norm"
  protect_core: true
  cross_layer_analysis: true
  compare_by_connection: true
  
  compute_metrics:
    - "activation"
    - "rayleigh_quotient"
    - "mutual_information"
    - "redundancy"

# ============================================================================
# SUPERNODE ROBUSTNESS ANALYSIS
# ============================================================================
supernode_robustness:
  enabled: true
  supernode_fraction: 0.01
  num_bootstrap_samples: 5
  batch_size: 32
  max_samples: 128
  
  metrics:
    - "scar_activation_power"
    - "scar_loss_proxy"
    - "rayleigh_quotient"
    - "activation_l2_norm"
  
  target_layers: null

# ============================================================================
# SUPERNODE SUMMARY ANALYSIS
# ============================================================================
# Generates summary plots:
# 1. Halo vs Non-Halo metrics by layer (mean activation, RQ, MI, redundancy)
# 2. Supernode outlier z-scores by layer (how much of an outlier)
supernode_summary:
  enabled: true
  outlier_analysis: true

# ============================================================================
# PRUNING CONFIGURATION
# ============================================================================
pruning:
  enabled: true
  
  sparsity_levels: [0, 0.25, 0.5, 0.75]
  
  selection_modes: ["low", "high"]
  
  distribution: "uniform"
  structured: true
  dependency_aware: true
  
  algorithms:
    # Alignment-based
    - "rayleigh_quotient"
    - "gaussian_mi_analytic"
    - "average_redundancy"
    # SCAR
    - "scar_loss_proxy"
    # Supernode-aware
    - "supernode_protection_score"
    - "supernode_connectivity_score"
    # Baselines
    - "activation_l2_norm"
    - "wanda"
    - "sparsegpt"
  
  single_strategy: null
  
  fine_tune:
    enabled: false

# ============================================================================
# ADVANCED ANALYSIS FLAGS
# ============================================================================
do_directed_redundancy: true
do_connectivity_pruning: true

# ============================================================================
# ANALYSIS & VISUALIZATION
# ============================================================================
analysis:
  save_scores: true
  generate_plots: true
  
  plots:
    histograms: true
    scatter_plots: true
    pruning_curves: true
    redundancy_heatmaps: true
  
  scatter_pairs:
    - ["activation_l2_norm", "rayleigh_quotient"]
    - ["activation_l2_norm", "gaussian_mi_analytic"]
    - ["scar_activation_power", "scar_loss_proxy"]
    - ["rayleigh_quotient", "scar_loss_proxy"]
    - ["average_redundancy", "rayleigh_quotient"]

visualization:
  format: "png"
  dpi: 300
