# ResNet-18 Alignment-Aware Pruning on ImageNet
# Complete pruning workflow with dependency handling for skip connections

experiment:
  name: "resnet18_pruning"
  type: "alignment_analysis"
  seed: 42
  device: "auto"                  # Auto-detect cuda/cpu
  output_dir: "./results/resnet18_pruning"
  num_networks: 3                 # Run 3 networks for error bars

model:
  name: "resnet18"
  pretrained: true                # Uses pretrained weights (auto-disables training)
  tracked_layers: null            # Auto-detect all conv and linear layers

# Dataset options:
#   - cifar10/cifar100: ./data (auto-downloads, but ResNet expects 224x224)
#   - imagenet: /n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k
dataset:
  name: "imagenet"
  data_path: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  batch_size: 128
  num_workers: 4

# Metrics to compute - these are also used for pruning
# Note: pairwise_redundancy_gaussian and synergy_gaussian_mmi have CNN
#       compatibility issues, so we use simpler metrics for now
metrics:
  enabled:
    - "rayleigh_quotient"
    - "activation_l2_norm"
  num_samples: 256
  
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6

# CNN activation preprocessing
# "unfold" (recommended): Best for RQ/covariance metrics
cnn:
  mode: "unfold"

# Pruning experiments
pruning:
  enabled: true
  
  # Sparsity levels to test (fraction of neurons to remove)
  sparsity_levels: [0.1, 0.2, 0.3, 0.5, 0.7]
  
  # Selection modes: WHICH neurons to prune based on their scores
  #   "low"    - prune neurons with LOWEST scores (remove least important)
  #   "high"   - prune neurons with HIGHEST scores (ablation study)
  #   "random" - prune randomly (baseline comparison)
  selection_modes: ["low", "high", "random"]
  
  # Distribution: HOW to allocate sparsity across layers
  #   "uniform"              - same % per layer (simple, default)
  #   "global_threshold"     - global score threshold
  #   "adaptive_sensitivity" - prune robust layers more, sensitive layers less
  #   "cascading"            - sequential layer-by-layer
  distribution: "adaptive_sensitivity"
  
  # Structured: prune entire neurons/channels (vs individual weights)
  # Required for alignment metrics (RQ is per-neuron)
  structured: true
  
  # Dependency-aware: handle skip connections (critical for ResNet)
  dependency_aware: true
  
  fine_tune:
    enabled: true
    epochs: 20
    learning_rate: 0.0001
    track_epoch_accuracy: true
    type_aware:
      enabled: false
      methods: []  # e.g. ["cluster_aware", "cluster_aware_typeft"]
      lr_multipliers:
        critical: 0.5
        synergistic: 1.0
        redundant: 1.5
        background: 1.5
      wd_multipliers:
        critical: 0.5
        synergistic: 1.0
        redundant: 1.25
        background: 1.5

# Performance (all optimizations enabled by default)
performance:
  eval_batches: null

analysis:
  class_conditioned: true         # Compute class-conditioned RQ
  save_scores: true
  generate_plots: true
  plots:
    histograms: true
    scatter_plots: true
    pruning_curves: true

visualization:
  format: "png"
  dpi: 300

# Expected: ~5-6% accuracy drop at 70% sparsity (vs ~10% for magnitude)
# Run: python scripts/run_experiment.py --config configs/examples/resnet_pruning.yaml
