# Progressive Dropout Analysis on CIFAR-10 with ResNet
# This configuration tests alignment-based dropout strategies

experiment_name: "cifar10_resnet_progressive"
experiment_type: "progressive_dropout"
device: "cuda"
seed: 42

# Dataset
dataset:
  name: "cifar10"
  data_path: "./data"
  batch_size: 128
  num_workers: 4

# Model
model:
  name: "resnet18"
  output_dim: 10
  pretrained: false
  cnn_mode: "unfold"

# Training
training:
  epochs: 20
  optimizer: "sgd"
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"

# Metrics
alignment:
  metrics:
    - "rayleigh_quotient"
    - "weight_cosine_similarity"

# Pruning
pruning:
  dropout_min: 0.0
  dropout_max: 0.9
  dropout_steps: 10
  dropout_mode: "scaled"
  strategies: ["high", "low", "random"]
  num_trials: 3

# Visualization
visualization:
  generate_plots: true
  plot_types:
    - "dropout_accuracy"
    - "alignment_heatmap" 