# ==================================================================================
# COMPREHENSIVE ALIGNMENT EXPERIMENT CONFIGURATION
# ==================================================================================
# This configuration file contains ALL possible options for alignment experiments
# with detailed descriptions and available choices for each parameter.
# 
# Usage:
#   python examples/comprehensive_alignment_experiment.py --config configs/comprehensive_alignment_config.yaml
#
# You can override any parameter from command line:
#   python examples/comprehensive_alignment_experiment.py --config configs/comprehensive_alignment_config.yaml --training_config.epochs 50
# ==================================================================================

# -----------------------------------------------------------------------------
# I. EXPERIMENT IDENTIFICATION & METADATA
# -----------------------------------------------------------------------------
name: "comprehensive_alignment_experiment"  # Unique experiment identifier
description: |
  Comprehensive alignment analysis experiment demonstrating all available
  features including training, metric computation, pruning, and analysis.
tags:                                      # Tags for organizing experiments
  - "alignment"
  - "pruning"
  - "comprehensive"
  - "demo"

# -----------------------------------------------------------------------------
# II. MODEL CONFIGURATION
# -----------------------------------------------------------------------------
model_name: "resnet18"                     # Model architecture to use
                                          # Options:
                                          #   - "mlp": Multi-layer perceptron
                                          #   - "resnet18", "resnet34", "resnet50": ResNet variants
                                          #   - "vgg16", "vgg19": VGG variants
                                          #   - "alexnet": AlexNet
                                          #   - "densenet121", "densenet169": DenseNet variants
                                          #   - "efficientnet_b0" to "efficientnet_b7": EfficientNet
                                          #   - "mobilenet_v2", "mobilenet_v3_small": MobileNet
                                          #   - Any torchvision model name

model_config:                             # Model-specific configuration
  num_classes: 10                         # Number of output classes
  pretrained: false                       # Use pretrained weights (if available)
  # Additional model-specific parameters can be added here
  # For MLP:
  # hidden_dims: [512, 256, 128]         # Hidden layer dimensions
  # activation: "relu"                    # Activation function
  # dropout_rate: 0.2                     # Dropout rate between layers

# -----------------------------------------------------------------------------
# III. DATASET CONFIGURATION
# -----------------------------------------------------------------------------
dataset_name: "cifar10"                   # Dataset to use
                                          # Options:
                                          #   - "mnist": MNIST handwritten digits
                                          #   - "fashion_mnist": Fashion-MNIST
                                          #   - "cifar10": CIFAR-10 (10 classes)
                                          #   - "cifar100": CIFAR-100 (100 classes)
                                          #   - "imagenet": ImageNet (requires data_path)
                                          #   - "svhn": Street View House Numbers

dataset_config:                           # Dataset-specific configuration
  data_path: "./data"                     # Path to dataset (auto-downloads if not exists)
  augmentation: true                      # Apply data augmentation
  normalize: true                         # Normalize inputs
  # Additional dataset-specific options:
  # validation_split: 0.1                 # Fraction of training data for validation
  # random_crop: 32                       # Random crop size (for CIFAR)
  # random_flip: true                     # Random horizontal flip
  # color_jitter: false                   # Color jittering augmentation

# -----------------------------------------------------------------------------
# IV. TRAINING CONFIGURATION
# -----------------------------------------------------------------------------
training_config:
  epochs: 20                              # Number of training epochs
  batch_size: 128                         # Batch size for training
  learning_rate: 0.001                    # Initial learning rate
  optimizer: "adam"                       # Optimizer to use
                                          # Options: "sgd", "adam", "adamw", "rmsprop"
  
  # Optimizer-specific parameters
  momentum: 0.9                           # Momentum (for SGD)
  weight_decay: 0.0001                    # Weight decay (L2 regularization)
  betas: [0.9, 0.999]                     # Beta parameters (for Adam/AdamW)
  eps: 1.0e-08                            # Epsilon (for Adam/AdamW)
  
  # Learning rate scheduler
  scheduler: "cosine"                     # LR scheduler type
                                          # Options: "none", "step", "cosine", "exponential", "plateau"
  scheduler_params:
    # For step scheduler:
    step_size: 10                         # Epochs between LR drops
    gamma: 0.1                            # LR decay factor
    # For cosine scheduler:
    T_max: 20                             # Maximum iterations
    eta_min: 0.0                          # Minimum LR
    # For plateau scheduler:
    patience: 5                           # Epochs to wait before reducing LR
    factor: 0.5                           # LR reduction factor
    
  # Training options
  gradient_clip: 1.0                      # Gradient clipping value (0 = disabled)
  mixed_precision: false                  # Use automatic mixed precision
  accumulation_steps: 1                   # Gradient accumulation steps

# -----------------------------------------------------------------------------
# V. ALIGNMENT METRICS CONFIGURATION
# -----------------------------------------------------------------------------
alignment_metrics:                        # List of metrics to compute
  # Rayleigh Quotient based metrics
  - "rayleigh_quotient"                   # Standard Rayleigh quotient (aliases: "rq", "RQ")
  - "delta_alignment"                     # Delta alignment metric
  - "normalized_delta_alignment"          # Normalized version of delta alignment
  
  # Information-theoretic metrics
  - "mutual_information_gaussian"         # Gaussian MI (aliases: "mi_gaussian", "mi_0")
  - "mutual_information_binning"          # Binning-based MI (aliases: "mi_binning", "mi_1")
  - "conditional_mutual_information"      # Conditional MI
  - "average_redundancy"                  # Average redundancy (alias: "redundancy_gaussian")
  - "node_redundancy"                     # Node-level redundancy (alias: "input_redundancy")
  - "layer_redundancy"                    # Layer-wise redundancy
  
  # Higher-order information metrics
  - "total_correlation"                   # Total correlation
  - "interaction_information"             # Interaction information
  - "connected_information"               # Connected information
  - "synergistic_information"             # Synergistic information
  
  # Partial Information Decomposition (PID)
  # - "pid_shared"                        # Shared information
  # - "pid_unique_x"                      # Unique information from X
  # - "pid_unique_y"                      # Unique information from Y
  # - "pid_synergy"                       # Synergistic information
  
  # Similarity metrics
  - "weight_cosine_similarity"            # Cosine similarity of weights
  - "activation_cosine_similarity"        # Cosine similarity of activations
  - "weight_activation_alignment"         # Alignment between weights and activations
  
  # Spectral metrics
  - "spectral_gap"                        # Spectral gap
  - "eigenvalue_alignment"                # Eigenvalue-based alignment
  - "spectral_clustering"                 # Spectral clustering score
  - "eigenvalue_entropy"                  # Entropy of eigenvalues
  - "spectral_norm_ratio"                 # Ratio of spectral norms
  
  # Task-specific metrics
  # - "task_alignment"                    # General task alignment
  # - "class_selectivity"                 # Class selectivity measure
  # - "feature_importance"                # Feature importance scores
  # - "representation_quality"            # Representation quality metric

metric_configs:                           # Metric-specific configurations
  rayleigh_quotient:
    scale_by_norm: true                   # Scale scores by weight norm
    aggregation_op: "mean"                # Aggregation for CNN layers
                                          # Options: "mean", "max", "sum", "var"
  
  mutual_information_gaussian:
    normalize: true                       # Normalize MI values
    epsilon: 1e-8                         # Small constant for stability
  
  mutual_information_binning:
    n_bins: 50                            # Number of bins for discretization
    strategy: "uniform"                   # Binning strategy
                                          # Options: "uniform", "quantile", "kmeans"
  
  spectral_gap:
    k: 10                                 # Number of eigenvalues to consider
    normalize: true                       # Normalize by trace

# Layers to compute metrics on (None = all tracked layers)
compute_metrics_on: null                  # Example: ["layer1", "layer2.conv1", "fc"]

# -----------------------------------------------------------------------------
# VI. PRUNING CONFIGURATION
# -----------------------------------------------------------------------------
pruning_strategy: "magnitude"             # Pruning strategy to use
                                          # Options:
                                          #   - "magnitude": Prune smallest weights
                                          #   - "gradient": Prune based on gradients
                                          #   - "random": Random pruning
                                          #   - "structured_magnitude": Structured pruning
                                          #   - "fisher": Fisher information based
                                          #   - "taylor": Taylor expansion based

pruning_config:
  amount: 0.5                             # Fraction of weights to prune (0.0-1.0)
  structured: false                       # Use structured pruning
  
  # For structured pruning:
  structure: "channel"                    # Structure to prune
                                          # Options: "channel", "filter", "head"
  
  # For iterative pruning:
  iterative: false                        # Apply pruning iteratively
  iterations: 5                           # Number of pruning iterations
  
  # Pruning mode
  mode: "global"                          # Pruning scope
                                          # Options:
                                          #   - "global": Prune globally across model
                                          #   - "layer": Prune each layer independently
                                          #   - "block": Prune by blocks/modules

# Use metric to guide pruning (None = use pruning_strategy only)
pruning_based_on_metric: null             # Example: "rayleigh_quotient"

# -----------------------------------------------------------------------------
# VII. EXPERIMENT WORKFLOW CONFIGURATION
# -----------------------------------------------------------------------------
# Control which steps of the experiment to run
train_model: true                         # Train model from scratch
compute_initial_metrics: true             # Compute metrics before pruning
apply_pruning: true                       # Apply pruning to model
fine_tune_after_pruning: true             # Fine-tune after pruning
fine_tune_epochs: 10                      # Number of fine-tuning epochs

# -----------------------------------------------------------------------------
# VIII. ANALYSIS & TRACKING CONFIGURATION
# -----------------------------------------------------------------------------
track_performance: true                   # Track performance metrics
save_metrics_history: true                # Save detailed metric history
save_checkpoints: true                    # Save model checkpoints

# Checkpointing configuration
checkpoint_dir: "./checkpoints"           # Directory for checkpoints
checkpoint_interval: 5                    # Save checkpoint every N epochs
save_best: true                           # Save best model based on validation

# -----------------------------------------------------------------------------
# IX. COMPUTATIONAL RESOURCES
# -----------------------------------------------------------------------------
device: "cuda"                            # Device to use
                                          # Options: "cuda", "cuda:0", "cuda:1", "cpu"
num_workers: 4                            # DataLoader workers
pin_memory: true                          # Pin memory for faster GPU transfer
seed: 42                                  # Random seed for reproducibility

# Memory optimization
force_cpu_for_large_metric_ops: false     # Move large operations to CPU
mixed_precision_metrics: false            # Use mixed precision for metrics

# -----------------------------------------------------------------------------
# X. LOGGING & VISUALIZATION
# -----------------------------------------------------------------------------
log_dir: "./logs"                         # Directory for logs
log_interval: 100                         # Log every N batches
verbose: true                             # Verbose logging

# Weights & Biases integration
wandb_project: null                       # W&B project name (null = disabled)
wandb_entity: null                        # W&B entity/team name
wandb_tags: []                            # Additional W&B tags
wandb_config: {}                          # Additional W&B config

# Visualization options
generate_plots: true                      # Generate analysis plots
plot_format: "png"                        # Plot format ("png", "pdf", "svg")
plot_dpi: 300                             # Plot resolution
save_raw_data: true                       # Save raw data for plots

# -----------------------------------------------------------------------------
# XI. DISTRIBUTED TRAINING (ADVANCED)
# -----------------------------------------------------------------------------
distributed: false                        # Use distributed training
world_size: 1                             # Number of processes
rank: 0                                   # Process rank
backend: "nccl"                           # Distributed backend
                                          # Options: "nccl", "gloo", "mpi"

# -----------------------------------------------------------------------------
# XII. EXPERIMENTAL FEATURES
# -----------------------------------------------------------------------------
experimental:
  # Advanced pruning options
  pruning_warmup: 0                       # Warmup epochs before pruning
  gradual_pruning: false                  # Apply pruning gradually
  pruning_schedule: "linear"              # Pruning schedule
                                          # Options: "linear", "exponential", "cosine"
  
  # Metric computation options
  metric_batch_size: null                 # Override batch size for metrics
  metric_sampling: 1.0                    # Fraction of data to use for metrics
  
  # Analysis options
  compute_hessian: false                  # Compute Hessian-based metrics
  track_gradient_flow: false              # Track gradient flow statistics
  save_activation_maps: false             # Save activation visualizations 