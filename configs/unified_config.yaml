# Unified Configuration for Alignment Analysis Framework

experiment_name: "mnist_alignment_analysis"

# Random seed for reproducibility
seed: 42

# Device configuration
device: "cuda"  # or "cpu"

# -----------------------------------------------------------------------------
# Model Configuration  
# -----------------------------------------------------------------------------
model:
  name: "mlp"
  
  # MLP specific
  hidden_sizes: [512, 256, 128, 64, 32, 16]
  activation: "relu"  # Options: relu, tanh, sigmoid, gelu
  dropout_rate: 0.0

# -----------------------------------------------------------------------------
# Dataset Configuration
# -----------------------------------------------------------------------------
dataset:
  name: "mnist"
  batch_size: 512
  num_workers: 4

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  epochs: 10  # Reduced for faster testing
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 0.0001

# -----------------------------------------------------------------------------
# Alignment Analysis Configuration
# -----------------------------------------------------------------------------
alignment:
  metrics: ["rayleigh_quotient"]  # Can add: gradient_similarity, mutual_information, cka
  track_during_training: true
  frequency: 1  # Compute every N epochs

# -----------------------------------------------------------------------------
# Pruning Configuration
# -----------------------------------------------------------------------------
pruning:
  enabled: true
  
  # Pruning algorithms to test
  algorithms: ["alignment"]  # Focus on alignment pruning
  
  # Sparsity levels to test (0-1 range with fine granularity)
  sparsity_levels: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  
  # Selection modes - which weights/neurons to prune
  # Test all three modes: low (prune poorly aligned), high (prune well aligned), random
  selection_modes: ["low", "high", "random"]
  
  # Scope of pruning
  scope: "layer"  # Options: layer, global, cascading
  
  # Fine-tuning after pruning
  fine_tune_after_pruning: true
  fine_tune_epochs: 10
  
  # Alignment-specific settings
  alignment_metric: "rayleigh_quotient"  # Metric for alignment-based pruning
  
  # Use structured pruning for alignment (prune entire neurons)
  alignment_structured_pruning: true

# -----------------------------------------------------------------------------
# Dropout Analysis Configuration
# -----------------------------------------------------------------------------
dropout:
  enabled: false  # Set to true to enable dropout analysis
  rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
  mode: "scaled"  # "scaled" or "zero"

# -----------------------------------------------------------------------------
# Visualization Configuration
# -----------------------------------------------------------------------------
visualization:
  generate_plots: true
  plot_format: "png"
  plot_dpi: 300
  save_raw_data: true

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  console: true
  file: true
  log_interval: 50

# -----------------------------------------------------------------------------
# Output Configuration
# -----------------------------------------------------------------------------
output:
  results_path: "results"
  save_checkpoints: false  # Don't save model checkpoints to save space
  save_networks: false     # Save full model at end 