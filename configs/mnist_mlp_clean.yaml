# Clean MNIST MLP Configuration

name: mnist_mlp_clean
seed: 42

# Model configuration for MLP
model_name: mlp
model_config:
  input_dim: 784  # 28x28 flattened
  hidden_dims: [512, 256, 128]
  output_dim: 10
  activation_type: relu
  dropout_rate: 0.0

# Dataset configuration for MNIST  
dataset_name: mnist
dataset_config:
  root: ./data
  download: true

# Training configuration
training_config:
  epochs: 2
  batch_size: 128
  learning_rate: 0.001
  optimizer: adam
  scheduler: cosine
  weight_decay: 0.0001
  device: cuda
  eval_interval: 1
  log_interval: 50

# Alignment metrics
alignment_metrics:
  - rayleigh_quotient

# CNN preprocessing mode (not used for MLP but required)
cnn_mode: unfold

# Pruning configuration defaults
apply_pruning: true
pruning_strategy: magnitude
pruning_config:
  amount: 0.5  # Will be overridden for experiments
  fine_tune_epochs: 5
  fine_tune_lr: 0.001

# For specialized pruning experiments
dropout_rates: [0.0, 0.2, 0.4, 0.6, 0.8, 0.9]
dropout_mode: scaled
exclude_classification_layer: true
num_random_trials: 3
recompute_scores: true

# Analysis configuration
analysis_config:
  compute_layer_metrics: true
  generate_plots: true
  generate_html_report: true
  plot_dpi: 300
  save_intermediate_results: true

# Evaluation
eval_model: true
eval_batches: 50  # Use subset for faster evaluation

# Workflow
train_model: true
compute_initial_metrics: true
fine_tune_after_pruning: true
compute_final_metrics: true

# Output directories
checkpoint_dir: ./checkpoints
log_dir: ./logs
results_dir: ./results 