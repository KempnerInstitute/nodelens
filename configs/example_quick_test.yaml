# Quick Test Configuration
# Minimal configuration for fast testing and debugging

name: quick_test
description: "Quick test configuration for debugging"
seed: 42

# Model - using MLP for fast experiments with CIFAR-10 dimensions
model_name: mlp
model_config:
  input_dim: 3072  # CIFAR-10 flattened (3*32*32)
  hidden_dims: [256, 128]
  output_dim: 10
  dropout_rate: 0.1
  activation_type: relu

# Dataset - using CIFAR-10
dataset_name: cifar10
dataset_config:
  data_path: ./data

# Training - minimal epochs
training_config:
  epochs: 5
  batch_size: 256
  learning_rate: 0.01
  optimizer: adam
  device: cuda
  log_interval: 100

# Metrics - just one metric
alignment_metrics:
  - rayleigh_quotient

# Pruning - simple magnitude pruning
apply_pruning: true
pruning_strategy: magnitude
pruning_config:
  amount: 0.5
  pruning_mode: low

# Analysis - minimal
analysis_config:
  generate_plots: true
  generate_html_report: true

# Workflow
train_model: true
compute_initial_metrics: true
fine_tune_after_pruning: false

# DataLoader parameters (separate from dataset)
num_workers: 4 