experiment_type: general_alignment
experiment_name: mnist_mlp_multi_pruning
seed: 42

data:
  dataset: mnist
  batch_size: 128
  num_workers: 4

model:
  architecture: mlp
  hidden_sizes: [512, 256]
  activation: relu
  dropout_rate: 0.2

training:
  optimizer:
    type: adam
    learning_rate: 0.001
  epochs: 10
  do_train: true

pruning:
  enabled: true
  strategy: magnitude
  target_sparsity: 0.5
  structured: false
  fine_tune_epochs: 5
