# Improved LP ablation validation config
# Key changes: 4x more texts (32 vs 8), 2x longer (512 vs 256), more layers (stride 4 vs 8)
# This should give more stable ΔNLL estimates with more positive values

name: llama3_8b_paper_results_lp_validation_improved
description: "LP validation with increased data for cleaner scatter plots"

experiment_type: llm_alignment
model_name: hf_causal_lm

model_config:
  model_id: "meta-llama/Llama-3.1-8B"
  torch_dtype: bfloat16
  device_map: auto

dataset_name: wikitext
batch_size: 1
device: cuda
seed: 42

# Only run the LP validation probe
supernode:
  enabled: true
  score_metric: scar_loss_proxy
  core_fraction: 0.01
  follower_fraction: 0.10

  # Improved LP ablation validation settings
  lp_ablation_validation:
    enabled: true
    layer_stride: 4           # More layers (was 8)
    layer_indices: null       # All layers at stride
    num_texts: 32             # 4x more texts (was 8)
    max_length: 512           # 2x longer (was 256)
    num_channels: 128         # Same (can increase to 256 if desired)
    quantile_bins: 8
    seed: 0

  # Disable other probes to speed up run
  read_halo_analysis:
    enabled: false
  conditional_halo_ablation:
    enabled: false

# Pruning settings (minimal - just for SCAR scores)
pruning:
  methods: [scar]
  sparsity_levels: [0.0]  # No actual pruning, just compute scores

# Evaluation
evaluate:
  compute_scar_metrics: true
  num_calibration_samples: 128

# Output
plots_dir: ./figures
results_dir: ./results
