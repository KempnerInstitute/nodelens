# CIFAR-100: Prune by Taylor saliency, protect activation-defined supernodes.
#
# This mirrors the LLM supernode-definition ablation:
# - pruning metric is the loss-proxy (Taylor saliency, squared)
# - protected core is defined either by LP (see *_lpSN_*) or by activation magnitude (this file)

name: "resnet18_cifar100_taylor_actSN_sweep_50_90"
experiment_type: "general_alignment"
seed: 42
device: "cuda"

# Model
model_name: "resnet18"
pretrained: false
model_config:
  num_classes: 100

# Dataset
dataset_name: "cifar100"
dataset_config:
  root: "./data"
  batch_size: 128
  num_workers: 4

# Training (use a nested training block so config_loader maps it correctly)
training:
  enabled: true
  epochs: 100
  learning_rate: 0.1
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_config:
    T_max: 100
    eta_min: 0.0
  momentum: 0.9
  weight_decay: 0.0001

# Pruning (nested pruning block so config_loader maps it correctly)
pruning_scope: "layer"
pruning:
  enabled: true
  structured: true
  algorithms:
    - "taylor_saliency"
  sparsity_levels: [0.5, 0.9]
  selection_modes: ["low"]
  fine_tune:
    enabled: false

# Metric hyperparameters
metric_configs:
  taylor_saliency:
    mode: "sq_mean"

# Supernode protection (vision)
supernode:
  enabled: true
  # Activation supernodes (L2 norm of activations)
  score_metric: "activation_l2_norm"
  core_fraction: 0.01
  protect_metrics:
    - "taylor_saliency"

generate_plots: true
plot_format: "png"
plot_dpi: 200

