# CIFAR-100: Prune by Taylor saliency, protect LP-defined supernodes.
#
# Goal: activation-supernode vs LP-supernode comparison on a vision model,
# mirroring the LLM supernode-definition ablation.

name: "resnet18_cifar100_taylor_lpSN_sweep_50_90"
experiment_type: "general_alignment"
seed: 42
device: "cuda"

# Model
model_name: "resnet18"
pretrained: false
model_config:
  num_classes: 100

# Dataset
dataset_name: "cifar100"
dataset_config:
  root: "./data"
  batch_size: 128
  num_workers: 4

# Training (use a nested training block so config_loader maps it correctly)
training:
  enabled: true
  epochs: 100
  learning_rate: 0.1
  optimizer: "sgd"
  scheduler: "cosine"
  scheduler_config:
    T_max: 100
    eta_min: 0.0
  momentum: 0.9
  weight_decay: 0.0001

# Pruning (nested pruning block so config_loader maps it correctly)
pruning_scope: "layer"
pruning:
  enabled: true
  structured: true
  algorithms:
    - "taylor_saliency"
  sparsity_levels: [0.5, 0.9]
  selection_modes: ["low"]
  fine_tune:
    enabled: false

# Metric hyperparameters
metric_configs:
  taylor_saliency:
    mode: "sq_mean"

# Supernode protection (vision)
supernode:
  enabled: true
  # LP-supernodes (Taylor saliency; use sq_mean to match SCAR-style squared LP)
  score_metric: "taylor_saliency"
  core_fraction: 0.01
  protect_metrics:
    - "taylor_saliency"

# Keep plots on for paper artifacts
generate_plots: true
plot_format: "png"
plot_dpi: 200

