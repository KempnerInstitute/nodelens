# =============================================================================
# ResNet-18 on CIFAR-100 - UNIFIED FORMAT (paper-ready)
# =============================================================================
# This mirrors the CIFAR-10 unified configs but targets CIFAR-100 to provide a
# harder dataset comparison (CIFAR-10 can be too easy for interpretation claims).
#
# Usage:
#   python scripts/run_experiment.py --config configs/vision_prune/resnet18_cifar100_unified.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# EXPERIMENT
# -----------------------------------------------------------------------------
experiment:
  name: "resnet18_cifar100_cluster_analysis"
  type: "cluster_analysis"
  seed: 42
  device: "cuda"
  output_dir: "./results/vision/resnet18_cifar100"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
model:
  name: "resnet18"
  pretrained: true
  num_classes: 100

# -----------------------------------------------------------------------------
# DATASET
# -----------------------------------------------------------------------------
dataset:
  name: "cifar100"
  root: "./data"
  batch_size: 128
  num_workers: 4

# -----------------------------------------------------------------------------
# TRAINING
# -----------------------------------------------------------------------------
training:
  enabled: true
  # CIFAR-100 typically needs longer training than CIFAR-10
  epochs: 100
  learning_rate: 0.1
  optimizer: "sgd"
  scheduler: "cosine"
  momentum: 0.9
  weight_decay: 0.0005

# -----------------------------------------------------------------------------
# CALIBRATION
# -----------------------------------------------------------------------------
calibration:
  num_samples: 5000

# -----------------------------------------------------------------------------
# METRICS
# -----------------------------------------------------------------------------
metrics:
  # BN-consistent: compute on post-BN, pre-ReLU activations (recommended)
  activation_point: "post_bn"
  activation_samples: "flatten_spatial"
  spatial_samples_per_image: 16

  rayleigh_quotient:
    enabled: true
    relative: false
    shrinkage: true

  redundancy:
    enabled: true
    sampling: "all"

  synergy:
    enabled: true
    target: "logit_margin"
    num_pairs: 10
    sampling: "top_k"

  taylor:
    enabled: true
    criterion: "gradient_weight"

# -----------------------------------------------------------------------------
# CLUSTERING
# -----------------------------------------------------------------------------
clustering:
  enabled: true
  n_clusters: 4
  type_names: ["critical", "redundant", "synergistic", "background"]
  normalize_features: true
  features: ["rayleigh_quotient", "redundancy", "synergy"]

  stability_enabled: true
  n_bootstrap: 50

  ablation:
    enabled: false
    modes: ["all", "rq_red", "rq_syn", "red_syn"]

# -----------------------------------------------------------------------------
# HALO ANALYSIS
# -----------------------------------------------------------------------------
halo_analysis:
  enabled: true
  percentile: 90.0
  use_activation_weight: true
  compute_influence_matrix: true

  permutation_baseline:
    enabled: false
    n_permutations: 100

# -----------------------------------------------------------------------------
# CASCADE ANALYSIS
# -----------------------------------------------------------------------------
cascade_analysis:
  enabled: true
  n_remove_per_group: 5
  damage_sample_fraction: 0.2

# -----------------------------------------------------------------------------
# PRUNING (stress test)
# -----------------------------------------------------------------------------
pruning:
  enabled: true
  distribution: "global_threshold"   # compare vs "uniform" in follow-up runs
  dependency_aware: true
  min_per_layer: 0.0
  max_per_layer: 0.95
  ratios: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9]
  algorithms:
    - "random"
    - "magnitude"
    - "activation_mean"
    - "taylor"
    - "network_slimming"
    - "geometric_median"
    - "hrank"
    - "composite"
    - "cluster_aware"
    - "cluster_aware_annealed"

  fine_tune:
    enabled: true
    epochs: 5
    learning_rate: 0.0001
    weight_decay: 0.0005
    max_batches: 200

# -----------------------------------------------------------------------------
# EVALUATION
# -----------------------------------------------------------------------------
evaluation:
  enabled: true
  accuracy: true
  loss: true
  per_class_accuracy: true

