# =============================================================================
# MobileNetV2 on CIFAR-100 - PAPER RUN (UNIFORM + POINTWISE-ONLY PRUNING)
# =============================================================================
# Mirrors the CIFAR-10 paper protocol, but targets CIFAR-100 (harder dataset).
#
# Usage:
#   python scripts/run_experiment.py --config configs/vision_prune/mobilenetv2_cifar100_unified_paper_uniform_pointwise.yaml
# =============================================================================

experiment:
  name: "mobilenetv2_cifar100_cluster_analysis"
  type: "cluster_analysis"
  seed: 42
  device: "cuda"
  output_dir: "./results/vision/mobilenetv2_cifar100"

model:
  name: "mobilenet_v2"
  pretrained: true
  num_classes: 100

dataset:
  name: "cifar100"
  root: "./data"
  batch_size: 128
  num_workers: 4

training:
  enabled: true
  epochs: 100
  learning_rate: 0.01
  optimizer: "sgd"
  scheduler: "cosine"
  momentum: 0.9
  weight_decay: 0.0005

calibration:
  num_samples: 5000

metrics:
  activation_point: "pre_bn"
  task_activation_samples: "match"
  compute_loss_proxy: true
  loss_proxy_n_calibration: 1024
  optimization:
    use_jit: false
    use_gpu_acceleration: false
    force_cpu_for_large_ops: true
    cpu_threshold: 100000000

  rayleigh_quotient:
    enabled: true
    relative: false
    shrinkage: true

  redundancy:
    enabled: true
    sampling: "all"

  synergy:
    enabled: true
    target: "logit_margin"
    num_pairs: 10
    sampling: "top_k"

  magnitude:
    enabled: true

  taylor:
    enabled: true
    criterion: "gradient_weight"

  activation_sparsity:
    enabled: true
    threshold: 0.01

  composite_weights:
    rayleigh_quotient: 0.33
    redundancy: -0.33
    synergy: 0.33

clustering:
  enabled: true
  n_clusters: 4
  type_names: ["critical", "redundant", "synergistic", "background"]
  normalize_features: true
  features: ["rayleigh_quotient", "redundancy", "synergy"]
  stability_enabled: true
  n_bootstrap: 50

halo_analysis:
  enabled: true
  percentile: 90.0
  use_activation_weight: true
  compute_influence_matrix: true

cascade_analysis:
  enabled: true
  n_remove_per_group: 5
  damage_sample_fraction: 0.2

pruning:
  enabled: true
  distribution: "uniform"
  dependency_aware: true
  min_per_layer: 0.0
  max_per_layer: 0.90
  ratios: [0.1, 0.3, 0.5]

  # Layer filtering for MobileNetV2 (skip depthwise; prune only pointwise 1x1 convs)
  pointwise_only: true
  skip_depthwise: true

  methods:
    - "random"
    - "magnitude"
    - "activation_mean"
    - "taylor"
    - "taylor_act"
    - "network_slimming"
    - "geometric_median"
    - "hrank"
    - "chip"
    - "composite"
    - "cluster_aware"
    - "cluster_aware_annealed"
    - "cluster_aware_depth_adaptive"
    - "cluster_aware_taylor_blend"
    - "cluster_aware_adaptive"
    - "cluster_aware"
    - "cluster_aware_annealed"

  fine_tune:
    enabled: true
    epochs: 5
    learning_rate: 0.0001
    weight_decay: 0.00001
    max_batches: 200

evaluation:
  enabled: true
  accuracy: true
  top1_accuracy: true
  loss: true
  compute_flops: true
  compute_params: true
  compute_memory: true
  measure_latency: false

visualization:
  enabled: true
  format: "pdf"
  dpi: 300
  style: "seaborn-v0_8-paper"
  histograms: true
  violin_plots: true
  correlation_heatmap: true
  cluster_scatter: true
  cluster_evolution: true
  influence_matrix: true
  halo_properties: true
  pruning_comparison: true
  pruning_recovery: true
  cascade_test: true
  metric_distributions: true

output:
  base_dir: "/path/to/results/losslens_vision"
  dir: "./results/vision/mobilenetv2_cifar100"
  save_metrics: true
  save_clusters: true
  save_figures: true
  save_checkpoints: true
  save_per_layer: true
