# =============================================================================
# ResNet-50 on ImageNet-100 - UNIFIED FORMAT (PAPER / UNIFORM DISTRIBUTION)
# =============================================================================
# Goal: a paper-ready ImageNet-100 run that avoids deep-network layer collapse by using:
#   - uniform per-layer sparsity allocation
#   - an explicit per-layer cap (max_per_layer)
# and a trimmed pruning method list (only what we report).
#
# Usage:
#   python scripts/run_experiment.py --config configs/vision_prune/resnet50_imagenet100_unified_paper_uniform.yaml
# =============================================================================

experiment:
  name: "resnet50_imagenet100_cluster_analysis"
  type: "cluster_analysis"
  seed: 42
  device: "cuda"
  output_dir: "./results/vision/resnet50_imagenet100"

model:
  name: "resnet50"
  pretrained: true
  num_classes: 100
  weights: "IMAGENET1K_V2"

dataset:
  name: "imagenet100"
  root: "./data/imagenet100"
  batch_size: 64
  num_workers: 8
  image_size: 224
  normalize: true

training:
  enabled: true
  epochs: 30
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"
  weight_decay: 0.0001

calibration:
  num_samples: 5000

metrics:
  activation_point: "post_bn"
  optimization:
    use_jit: false
    use_gpu_acceleration: false
    force_cpu_for_large_ops: true
    cpu_threshold: 100000000

  rayleigh_quotient:
    enabled: true
    relative: false
    shrinkage: true

  redundancy:
    enabled: true
    sampling: "all"

  synergy:
    enabled: true
    target: "logit_margin"
    num_pairs: 10
    sampling: "top_k"

  magnitude:
    enabled: true

  taylor:
    enabled: true
    criterion: "gradient_weight"

  activation_sparsity:
    enabled: true
    threshold: 0.01

  composite_weights:
    rayleigh_quotient: 0.33
    redundancy: -0.33
    synergy: 0.33

clustering:
  enabled: true
  n_clusters: 4
  type_names: ["critical", "redundant", "synergistic", "background"]
  normalize_features: true
  features: ["rayleigh_quotient", "redundancy", "synergy"]
  stability_enabled: true
  n_bootstrap: 30

halo_analysis:
  enabled: true
  percentile: 90.0
  use_activation_weight: true
  compute_influence_matrix: true

cascade_analysis:
  enabled: true
  n_remove_per_group: 5
  damage_sample_fraction: 0.1

pruning:
  enabled: true
  distribution: "uniform"
  dependency_aware: true
  min_per_layer: 0.0
  max_per_layer: 0.90
  ratios: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9]

  # Keep only methods we report (reduces runtime substantially vs. an exhaustive sweep)
  methods:
    - "random"
    - "magnitude"
    - "activation_mean"
    - "taylor"
    - "network_slimming"
    - "geometric_median"
    - "hrank"
    - "composite"
    - "cluster_aware"
    - "cluster_aware_annealed"

  fine_tune:
    enabled: true
    epochs: 3
    learning_rate: 0.00001
    weight_decay: 0.0001
    max_batches: 50

evaluation:
  enabled: true
  accuracy: true
  top1_accuracy: true
  top5_accuracy: true
  loss: true
  per_class_accuracy: true
  confusion_matrix: true
  calibration_enabled: true
  expected_calibration_error: true
  reliability_diagram: true
  compute_flops: true
  compute_params: true
  compute_memory: true
  # Latency benchmarking can be noisy/slow on shared clusters; keep off for the paper run.
  measure_latency: false

visualization:
  enabled: true
  format: "pdf"
  dpi: 300
  style: "seaborn-v0_8-paper"
  histograms: true
  violin_plots: true
  correlation_heatmap: true
  cluster_scatter: true
  cluster_evolution: true
  influence_matrix: true
  halo_properties: true
  pruning_comparison: true
  pruning_recovery: true
  cascade_test: true
  metric_distributions: true
  layer_importance_heatmap: true
  sensitivity_curves: true

output:
  base_dir: "/n/holylfs06/LABS/kempner_project_b/Lab/alignment/alignment_red"
  dir: "./results/vision/resnet50_imagenet100"
  save_metrics: true
  save_clusters: true
  save_figures: true
  save_checkpoints: true
  save_per_layer: true

