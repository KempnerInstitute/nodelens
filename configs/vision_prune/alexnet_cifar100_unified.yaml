# =============================================================================
# AlexNet on CIFAR-100 - UNIFIED FORMAT
# =============================================================================
# Classic AlexNet architecture on CIFAR-100.
# AlexNet has distinct layer structure (no skip connections, no BN originally)
# which provides a different test case for the functional taxonomy.
# CIFAR-100 runs faster than ImageNet-100 for main paper figures.
#
# Usage: python scripts/run_experiment.py --config configs/vision_prune/alexnet_cifar100_unified.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# EXPERIMENT
# -----------------------------------------------------------------------------
experiment:
  name: "alexnet_cifar100_cluster_analysis"
  type: "cluster_analysis"
  seed: 42
  device: "cuda"
  output_dir: "./results/vision/alexnet_cifar100"

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
model:
  name: "alexnet"
  pretrained: true
  num_classes: 100

# -----------------------------------------------------------------------------
# DATASET
# -----------------------------------------------------------------------------
dataset:
  name: "cifar100"
  root: "./data"
  batch_size: 128
  num_workers: 4

# -----------------------------------------------------------------------------
# TRAINING
# -----------------------------------------------------------------------------
training:
  enabled: true
  epochs: 50
  learning_rate: 0.01
  optimizer: "sgd"
  scheduler: "cosine"
  momentum: 0.9
  weight_decay: 0.0005

# -----------------------------------------------------------------------------
# CALIBRATION
# -----------------------------------------------------------------------------
calibration:
  num_samples: 5000

# -----------------------------------------------------------------------------
# METRICS
# -----------------------------------------------------------------------------
metrics:
  activation_point: "pre_bn"
  task_activation_samples: "match"
  compute_loss_proxy: true
  loss_proxy_n_calibration: 1024
  calibration_mode: "indices"
  calibration_num_workers: 0
  optimization:
    use_jit: false
    use_gpu_acceleration: false
    force_cpu_for_large_ops: true

  rayleigh_quotient:
    enabled: true
    relative: false
    shrinkage: true

  redundancy:
    enabled: true
    sampling: "all"

  synergy:
    enabled: true
    target: "logit_margin"
    num_pairs: 10
    sampling: "top_k"

  magnitude:
    enabled: true

  taylor:
    enabled: true
    criterion: "gradient_weight"

# -----------------------------------------------------------------------------
# CLUSTERING
# -----------------------------------------------------------------------------
clustering:
  n_clusters: 4
  method: "kmeans"
  features:
    - "log_rq"
    - "redundancy"
    - "synergy"
  standardize: true
  assign_types: true
  type_mapping_strategy: "centroid_ranking"

# -----------------------------------------------------------------------------
# HALO ANALYSIS
# -----------------------------------------------------------------------------
halo_analysis:
  enabled: true
  threshold_percentile: 90
  influence_type: "activation_weighted"
  skip_residual_edges: true

# -----------------------------------------------------------------------------
# PRUNING
# -----------------------------------------------------------------------------
pruning:
  enabled: true
  methods:
    - random
    - magnitude
    - activation_mean
    - taylor
    - taylor_act
    - network_slimming
    - geometric_median
    - hrank
    - chip
    - composite
    - cluster_aware
    - cluster_aware_annealed
    - cluster_aware_depth_adaptive
    - cluster_aware_taylor_blend
    - cluster_aware_adaptive
  sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  distribution: "uniform"
  dependency_aware: false
  min_per_layer: 0.0
  max_per_layer: 0.90
  fine_tuning:
    enabled: true
    epochs: 5
    learning_rate: 0.001
    optimizer: "adam"
    scheduler: "cosine"

# -----------------------------------------------------------------------------
# VISUALIZATION
# -----------------------------------------------------------------------------
visualization:
  enabled: true
  save_format: "png"
  dpi: 150
  generate:
    - metric_distributions
    - cluster_scatter
    - cluster_evolution
    - halo_influence_matrix
    - pruning_curves
    - cascade_damage
