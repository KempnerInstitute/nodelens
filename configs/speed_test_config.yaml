# Speed Test Configuration
# Demonstrates the performance improvements with parallel evaluation

experiment_name: "pruning_speed_test"

# Core settings
seed: 42
device: "cuda"

# Simple model for quick testing
model:
  name: "mlp"
  hidden_sizes: [256, 128]  # Smaller model for faster testing
  activation: "relu"

# Dataset
dataset:
  name: "mnist"
  batch_size: 1024
  num_workers: 4

# Minimal training
training:
  epochs: 2  # Just 2 epochs for quick test
  optimizer: "adam"
  learning_rate: 0.001

# Alignment
alignment:
  metrics: ["rayleigh_quotient"]

# Pruning test
pruning:
  enabled: true
  algorithms: ["alignment"]
  sparsity_levels: [0.0, 0.2, 0.4, 0.6, 0.8]  # Just 5 levels
  selection_modes: ["low", "high", "random"]  # All 3 modes = 15 configs total
  fine_tune: false  # No fine-tuning for speed

# Multi-network for parallel testing
num_networks: 5  # 5 networks × 5 sparsity levels × 3 modes = 75 total configs

# Enable tensorized training for speed
use_tensorized_training: true

# KEY OPTIMIZATION: Evaluate on subset of data
eval_batches: 10  # Only evaluate on 10 batches (~10K samples) instead of full 60K

# This should complete in seconds rather than minutes! 