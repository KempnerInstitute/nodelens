# ResNet CIFAR Configuration
# Standard configuration for ResNet experiments on CIFAR datasets

name: resnet_cifar_experiment
description: "ResNet experiments on CIFAR with comprehensive analysis"
tags: [resnet, cifar, pruning]
seed: 42

# Model
model_name: resnet18
model_config:
  num_classes: 10  # Change to 100 for CIFAR-100
  pretrained: false

# Dataset
dataset_name: cifar10  # or cifar100
dataset_config:
  data_path: ./data
  num_workers: 4
  augmentation:
    train:
      random_crop: true
      crop_size: 32
      crop_padding: 4
      random_horizontal_flip: true
      normalize: true
      mean: [0.4914, 0.4822, 0.4465]  # CIFAR-10 stats
      std: [0.2023, 0.1994, 0.2010]
    val:
      normalize: true
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2023, 0.1994, 0.2010]

# Training
training_config:
  epochs: 200
  batch_size: 128
  learning_rate: 0.1
  optimizer: sgd
  optimizer_kwargs:
    momentum: 0.9
    weight_decay: 0.0001
    nesterov: true
  scheduler: cosine
  scheduler_kwargs:
    T_max: 200
    eta_min: 0
  device: cuda
  log_interval: 50
  eval_interval: 1

# Alignment Metrics
alignment_metrics:
  - rayleigh_quotient
  - spectral_gap
  - weight_similarity

metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
    aggregation_op: mean
  spectral_gap:
    n_eigenvalues: 5
  weight_similarity:
    metric: cosine

# Pruning
apply_pruning: true
pruning_strategy: iterative_magnitude
pruning_config:
  amount: 0.9
  iterative_steps: 10
  schedule: polynomial
  initial_sparsity: 0.0
  final_sparsity: 0.9
  power: 3
  fine_tune_epochs: 10
  fine_tune_lr: 0.01
  pruning_mode: low

# Analysis
analysis_config:
  save_activations: true
  save_weights: true
  save_interval: 20
  generate_plots: true
  generate_html_report: true
  plot_dpi: 300

# Workflow
train_model: true
compute_initial_metrics: true
fine_tune_after_pruning: true
compute_final_metrics: true 