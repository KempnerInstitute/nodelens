# Pruning Strategy Comparison Configuration
# Configuration for comparing different pruning strategies

name: pruning_comparison
description: "Compare different pruning strategies on the same model"
seed: 42

# Model - using ResNet for realistic comparison
model_name: resnet18
model_config:
  num_classes: 10
  pretrained: false

# Dataset
dataset_name: cifar10
dataset_config:
  data_path: ./data
  num_workers: 4

# Training - shorter for comparison
training_config:
  epochs: 50
  batch_size: 128
  learning_rate: 0.1
  optimizer: sgd
  optimizer_kwargs:
    momentum: 0.9
    weight_decay: 0.0001
  scheduler: step
  scheduler_kwargs:
    step_size: 20
    gamma: 0.1
  device: cuda

# Metrics - comprehensive set
alignment_metrics:
  - rayleigh_quotient
  - mutual_information
  - spectral_gap
  - weight_similarity

# Pruning - will be varied in experiments
apply_pruning: true
pruning_strategy: magnitude  # Will override this
pruning_config:
  amount: 0.5
  pruning_mode: low
  exclude_modules: [fc, classifier]

# Analysis
analysis_config:
  generate_plots: true
  generate_html_report: true
  compute_statistics: true

# Workflow
train_model: true
compute_initial_metrics: true
fine_tune_after_pruning: true
fine_tune_epochs: 20

# Note: To compare strategies, run multiple times with different pruning_strategy:
# python unified_experiment.py --config configs/example_pruning_comparison.yaml --pruning_strategy magnitude
# python unified_experiment.py --config configs/example_pruning_comparison.yaml --pruning_strategy gradient
# python unified_experiment.py --config configs/example_pruning_comparison.yaml --pruning_strategy random 