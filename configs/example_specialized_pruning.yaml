# Example configuration for specialized pruning experiments
# This config demonstrates how to use cascading_layer and layer_isolated pruning

name: specialized_pruning_experiment
description: "Example of using specialized pruning experiments with unified_experiment.py"
tags: [pruning, cascading, layer_isolated]
seed: 42

# ============================================================================
# PRUNING EXPERIMENT CONFIGURATION
# ============================================================================
# Type of pruning experiment to run
pruning_experiment: cascading_layer  # Options: standard, cascading_layer, layer_isolated

# Dropout rates to evaluate (for specialized experiments)
dropout_rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]

# Pruning modes to evaluate
pruning_modes: [low, high, random]  # Which importance scores to prune

# Cascading-specific options
cascade_direction: forward  # Options: forward, backward
recompute_scores: true  # Whether to recompute scores after each layer

# Number of random trials (for random mode averaging)
num_random_trials: 3

# Exclude classification layer from pruning
exclude_classification_layer: true

# CNN preprocessing mode
cnn_mode: unfold  # Options: unfold, patchwise, batch_patch_combined
# - unfold: Unfolds conv layers and flattens (standard approach)
# - patchwise: Keeps patches separate for patch-wise metric computation
# - batch_patch_combined: Combines batch and patch dimensions

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model_name: resnet18
model_config:
  num_classes: 10
  pretrained: false

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset_name: cifar10
dataset_config:
  data_path: ./data

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training_config:
  epochs: 20  # Train for 20 epochs
  batch_size: 128
  learning_rate: 0.1
  optimizer: sgd
  optimizer_kwargs:
    momentum: 0.9
    weight_decay: 0.0001
  scheduler: cosine
  scheduler_kwargs:
    T_max: 20
    eta_min: 0.001
  device: cuda

# ============================================================================
# ALIGNMENT METRICS
# ============================================================================
alignment_metrics:
  - rayleigh_quotient  # First metric is used for pruning decisions
  - rq_patchwise  # Patchwise variant for conv layers
  - weight_cosine_similarity

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================
analysis_config:
  generate_plots: true
  plot_dpi: 300
  generate_html_report: true

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
checkpoint_dir: ./checkpoints
log_dir: ./logs
output_dir: ./results

# Additional experiment settings
use_timestamp: true
timestamp_format: "%Y%m%d_%H%M%S"
verbose: true

# ============================================================================
# USAGE EXAMPLES
# ============================================================================
# All parameters are now in the config file! Just run:
# python unified_experiment.py --config this_file.yaml
#
# You can still override parameters from command line if needed:
# python unified_experiment.py --config this_file.yaml --dropout_rates 0.2 0.4 0.6
#
# To run different experiment types, create copies of this file and change
# the pruning_experiment parameter:
#
# For layer-isolated pruning:
#   pruning_experiment: layer_isolated
#
# For standard pruning:
#   pruning_experiment: standard
#   # Also add standard pruning parameters:
#   pruning_strategy: magnitude
#   pruning_config:
#     amount: 0.5
#     pruning_mode: low 