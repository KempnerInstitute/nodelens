# Test configuration for 70% pruning
experiment_type: general_alignment
experiment_name: mnist_mlp_pruning_70percent
seed: 42

# Data configuration
data:
  dataset: mnist
  batch_size: 128
  num_workers: 4

# Model configuration
model:
  architecture: mlp
  hidden_sizes: [512, 256]
  activation: relu
  dropout_rate: 0.2

# Training configuration
training:
  optimizer:
    type: adam
    learning_rate: 0.001
  epochs: 10
  do_train: true

# Pruning configuration
pruning:
  enabled: true
  strategy: magnitude
  target_sparsity: 0.7  # 70% pruning
  structured: false
  fine_tune_epochs: 5

# Metrics configuration
metrics:
  - accuracy
  - loss

# Analysis configuration
analysis:
  compute_representations: true
  compute_metrics: true
  save_results: true

# Output configuration
output:
  save_dir: ./results
  save_checkpoints: true
  checkpoint_frequency: 5 