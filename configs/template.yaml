# =============================================================================
# Alignment Framework - Configuration Template
# =============================================================================
# All available options documented. Copy and modify for your experiments.
# Usage: python scripts/run_experiment.py --config configs/template.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# EXPERIMENT
# -----------------------------------------------------------------------------
experiment:
  name: "my_experiment"           # Experiment identifier
  type: "alignment_analysis"      # "alignment_analysis" (vision/MLP) or "llm_alignment" (LLMs)
  seed: 42                        # Random seed
  device: "cuda"                  # "cpu", "cuda", "cuda:0"
  output_dir: "./results"         # Output directory

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
model:
  # Model name:
  #   Vision: "resnet18", "resnet50", "vgg16", "alexnet", "mobilenet_v2"
  #   Custom: "mlp", "cnn"
  #   LLM: "hf_causal_lm" (set model_id below)
  name: "resnet18"
  pretrained: true
  
  # Layers to track (null = auto-detect)
  # Vision: ["layer1", "layer2", "layer3", "layer4"]
  # LLM (HFCausalLM): ["model.model.layers.*.mlp.up_proj"]
  #   Note: HFCausalLM wraps LlamaForCausalLM, so paths have 'model.model.' prefix
  tracked_layers: null
  
  # HuggingFace config (for LLMs only)
  model_id: null                  # e.g., "meta-llama/Llama-3.1-8B"
  torch_dtype: "bfloat16"         # "float32", "float16", "bfloat16"
  device_map: "auto"              # "auto", null, or explicit mapping

# -----------------------------------------------------------------------------
# DATASET
# -----------------------------------------------------------------------------
dataset:
  name: "cifar10"                 # Vision: mnist, cifar10, cifar100 | LLM: wikitext, c4
  data_path: "./data"
  batch_size: 128
  num_workers: 4

# -----------------------------------------------------------------------------
# METRICS
# -----------------------------------------------------------------------------
# Metrics to compute for alignment analysis
# Available: rayleigh_quotient, activation_l2_norm, activation_outlier_index,
#            pairwise_redundancy_gaussian, synergy_gaussian_mmi,
#            mutual_information_gaussian, weight_cosine_similarity
metrics:
  enabled:
    - "rayleigh_quotient"
    - "activation_l2_norm"
    - "pairwise_redundancy_gaussian"
  
  # Number of data samples for metric computation
  num_samples: 128
  
  # Metric-specific settings
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6
  
  pairwise_redundancy_gaussian:
    mode: "output_based"          # "output_based" (fast) or "covariance_based"
    num_pairs: 10
  
  synergy_gaussian_mmi:
    num_pairs: 10
  
  # Composite score weights (for combining metrics into single importance score)
  # Used when pruning.scoring: "composite" or supernode.score_metric: "composite"
  composite_weights:
    activation_l2_norm: 0.2
    rayleigh_quotient: 0.3
    pairwise_redundancy_gaussian: -0.2   # Negative = penalize redundancy
    synergy_gaussian_mmi: 0.2

# -----------------------------------------------------------------------------
# TRAINING (optional)
# -----------------------------------------------------------------------------
training:
  enabled: false                  # Set true to train model
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"               # "sgd", "adam", "adamw"
  scheduler: "cosine"             # "none", "step", "cosine"

# -----------------------------------------------------------------------------
# SUPERNODE DETECTION
# -----------------------------------------------------------------------------
supernode:
  enabled: false
  score_metric: "activation_l2_norm"  # Metric to identify supernodes
  core_fraction: 0.01             # Top X% as supernodes
  min_core_neurons: 32
  protect_core: true              # Prevent pruning supernodes
  
  # Cross-layer analysis (LLM only)
  cross_layer_analysis: false
  follower_fraction: 0.10

# -----------------------------------------------------------------------------
# PRUNING
# -----------------------------------------------------------------------------
pruning:
  enabled: false
  
  # Strategy: "magnitude", "alignment", "hybrid", "random", "gradient"
  strategy: "alignment"
  
  # Sparsity
  target_sparsity: 0.5
  sparsity_levels: [0.1, 0.3, 0.5, 0.7]
  
  # How to distribute sparsity across layers
  # "uniform", "global_threshold", "adaptive_sensitivity", "cascading"
  distribution: "uniform"
  
  # Scoring metric for importance (uses metrics.composite_weights if "composite")
  scoring: "rayleigh_quotient"
  
  # Direction: "low" = prune low-importance, "high" = prune high-importance
  direction: "low"
  
  structured: true                # Prune entire neurons/channels
  dependency_aware: false         # Handle ResNet/transformer dependencies
  
  fine_tune:
    enabled: true
    epochs: 20
    learning_rate: 0.0001

# -----------------------------------------------------------------------------
# LLM-SPECIFIC (only for experiment.type: "llm_alignment")
# -----------------------------------------------------------------------------
llm:
  # SCAR metrics for FFN analysis
  scar_metrics: false             # Enable SCAR (activation power, curvature, loss proxy)
  scar_num_samples: 64
  scar_max_length: 512
  
  # Perplexity evaluation
  evaluate_perplexity: false
  evaluation_dataset: "wikitext"
  evaluation_num_samples: 100

# -----------------------------------------------------------------------------
# CNN-SPECIFIC
# -----------------------------------------------------------------------------
cnn:
  mode: "unfold"                  # "unfold", "patchwise", "channel_variance"

# -----------------------------------------------------------------------------
# ANALYSIS & VISUALIZATION
# -----------------------------------------------------------------------------
analysis:
  save_scores: true
  generate_plots: true
  class_conditioned: false        # Class-conditioned metrics (vision)
  
  # Plots to generate
  plots:
    histograms: true
    scatter_plots: true
    heatmaps: true
    pruning_curves: true
    supernode_analysis: true
  
  histogram_bins: 100
  scatter_pairs:
    - ["activation_l2_norm", "rayleigh_quotient"]
    - ["pairwise_redundancy_gaussian", "synergy_gaussian_mmi"]

visualization:
  format: "png"                   # "png", "pdf", "svg"
  dpi: 300

# -----------------------------------------------------------------------------
# OUTPUT PATHS
# -----------------------------------------------------------------------------
log_dir: "./logs"
checkpoint_dir: "./checkpoints"
