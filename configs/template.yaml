# Alignment Framework Configuration Template
# All available parameters with options documented inline

experiment:
  name: "my_experiment"  # Experiment identifier
  seed: 42  # Random seed for reproducibility
  device: "cuda"  # Device: 'cpu', 'cuda', 'cuda:0', etc.

model:
  name: "resnet18"  # Options: 'resnet18', 'resnet50', 'vgg16', 'mlp', 'gpt2', 'meta-llama/Meta-Llama-3-8B', etc.
  pretrained: true  # Use pretrained weights
  checkpoint_path: null  # Path to custom checkpoint (optional)
  tracked_layers: null  # Layer names to track (null=auto-detect)
  track_inputs: true  # Capture layer inputs
  track_outputs: true  # Capture layer outputs

dataset:
  name: "cifar10"  # Options: 'mnist', 'cifar10', 'cifar100', 'imagenet', 'wikitext', 'c4'
  data_path: "./data"  # Data directory
  batch_size: 128  # Batch size
  num_workers: 4  # Number of data loading workers
  augmentation: true  # Data augmentation (vision only)

metrics:
  enabled:
    - "rayleigh_quotient"
    - "pairwise_redundancy_gaussian"
  
  rayleigh_quotient:
    relative: true
    regularization: 1.0e-6
    min_samples: 2
  
  pairwise_redundancy_gaussian:
    mode: "output_based"     # 'output_based' or 'covariance_based'
    num_pairs: 10
    sampling_strategy: "random"
    aggregation: "mean"
  
  synergy_gaussian_mmi:
    num_pairs: 10
    sampling_strategy: "random"

training:
  enabled: false  # Enable training
  epochs: 100  # Number of epochs
  learning_rate: 0.001  # Learning rate
  optimizer: 'adam'  # Options: 'sgd', 'adam', 'adamw'
  scheduler: 'cosine'  # Options: 'none', 'step', 'cosine', 'exponential'
  compute_metrics_during_training: false  # Track metrics during training
  metric_frequency: 100  # Compute metrics every N steps
  metric_sample_size: 512  # Batch subset size for efficiency

pruning:
  enabled: false
  algorithms: ["alignment"]        # Options: 'magnitude', 'random', 'alignment', 'hybrid', ...
  sparsity_levels: [0.3, 0.5, 0.7]
  selection_modes: ["low"]         # 'low', 'high', or 'random'
  alignment_metric: "rayleigh_quotient"
  scopes: "layer"                  # 'layer', 'global', or 'cascading'
  structured: true
  dependency_aware: false          # Propagate masks across dependent layers (ResNet blocks, etc.)
  
  fine_tune:
    enabled: true
    epochs: 20
    learning_rate: 0.0001
  
  composite_weights:
    alpha_mi: 0.0
    beta_synergy: 0.3
    gamma_redundancy: 0.4
    delta_rq: 0.3

analysis:
  class_conditioned: false
  save_scores: true

visualization:
  enabled: true
  format: "png"
  dpi: 300
  training_curves: true
  alignment_curves: true
  dropout_plots: false
  eigen_plots: true
  pruning_plots: true

# Post-experiment analysis (optional)
# Runs AnalysisRunner after experiment completes to generate additional visualizations
post_analysis:
  analyses:
    - histograms
    - scatter_plots
    - pruning_curves
  histograms:
    bins: 100
    top_k: 5
  scatter_plots:
    pairs:
      - ["activation_l2_norm", "rayleigh_quotient"]
