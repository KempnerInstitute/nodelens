# Fast wiring check for gradient-projection BP.
# Not a paper result.

experiment:
  name: "lr_smoke_resnet18_cifar100_bp_gradproj"
  type: "cluster_analysis"
  seed: 42
  device: "cpu"

model:
  name: "resnet18"
  pretrained: false
  num_classes: 100

dataset:
  name: "cifar100"
  root: "./data"
  batch_size: 16
  num_workers: 0

training:
  enabled: true
  epochs: 1
  max_batches: 2
  learning_rate: 0.01
  optimizer: "sgd"
  scheduler: "none"
  momentum: 0.9
  weight_decay: 0.0005

learning_rule:
  method: "none"
  lambda: 0.0
  max_layers: 4
  skip_depthwise: true
  grad_projection_strength: 0.5
  grad_projection_ema: 0.9
  grad_projection_ridge: 0.01
  grad_projection_update_period: 1
  grad_projection_max_patches: 1024

calibration:
  num_samples: 64

metrics:
  activation_point: "pre_bn"
  task_activation_samples: "gap"
  activation_samples: "flatten_spatial"
  spatial_samples_per_image: 4
  rayleigh_quotient:
    enabled: true
  redundancy:
    enabled: true
    sampling: "all"
  synergy:
    enabled: false

clustering:
  enabled: true
  n_clusters: 4
  stability_enabled: false
  ablation:
    enabled: false

halo_analysis:
  enabled: false

cascade_analysis:
  enabled: false

pruning:
  enabled: false

visualization:
  enabled: false

output:
  base_dir: "./results/learning_rules/smoke"
