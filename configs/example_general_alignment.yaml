# Example configuration for general alignment experiment
# This experiment performs comprehensive alignment analysis with training, dropout analysis, and pruning

name: general_alignment_experiment
description: "Comprehensive alignment analysis with training, metrics, and dropout experiments"
tags: [alignment, training, dropout, pruning]
seed: 42

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
do_train: true
training_epochs: 20
learning_rate: 0.1
optimizer: sgd
scheduler: cosine
scheduler_config:
  T_max: 20
  eta_min: 0.0

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model_name: resnet18
model_config:
  num_classes: 10
  pretrained: false

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset_name: cifar10
dataset_config:
  data_path: ./data

# ============================================================================
# ALIGNMENT MEASUREMENT
# ============================================================================
measure_alignment_during_training: true
alignment_frequency: 1  # Measure every epoch
alignment_methods:
  - rayleigh_quotient
  - weight_cosine_similarity
measure_expected_distribution: true
distribution_bins: 50

# CNN preprocessing mode
cnn_mode: unfold  # Options: unfold, patchwise, batch_patch_combined

# ============================================================================
# PROGRESSIVE DROPOUT ANALYSIS
# ============================================================================
do_dropout_analysis: true
dropout_rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
dropout_mode: scaled  # scaled or unscaled
dropout_pruning_mode: global  # global, per_layer_combined, per_layer_independent

# ============================================================================
# PRUNING EXPERIMENTS
# ============================================================================
do_pruning_experiments: true
pruning_strategies:
  - magnitude
  - gradient
  - fisher
pruning_amounts: [0.1, 0.3, 0.5, 0.7, 0.9]
fine_tune_after_pruning: true
fine_tune_epochs: 10

# ============================================================================
# EIGENFEATURE ANALYSIS
# ============================================================================
do_eigenfeature_analysis: true

# ============================================================================
# VISUALIZATION AND OUTPUT
# ============================================================================
generate_plots: true
plot_format: png
plot_dpi: 300

# Aggregation options
aggregate_alignment: false
exclude_classification_layer: true

# Results saving
save_intermediate_results: true
save_networks: false
checkpoint_dir: ./checkpoints
log_dir: ./logs
output_dir: ./results

# ============================================================================
# RESOURCE MANAGEMENT
# ============================================================================
batch_size: 128
num_workers: 4
device: cuda

# ============================================================================
# USAGE
# ============================================================================
# To run this experiment:
# python examples/unified_experiment.py --config configs/example_general_alignment.yaml
#
# This will:
# 1. Train a ResNet-18 on CIFAR-10 for 20 epochs
# 2. Measure alignment metrics throughout training
# 3. Perform progressive dropout analysis with low/high/random strategies
# 4. Test multiple pruning strategies at various sparsity levels
# 5. Analyze eigenfeatures of the network
# 6. Generate comprehensive visualizations and reports 