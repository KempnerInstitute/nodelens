# Clean Configuration for Alignment Analysis
# This is a streamlined config focusing on essential parameters

# ==============================================================================
# EXPERIMENT IDENTIFICATION
# ==============================================================================
experiment_name: "alignment_analysis"
experiment_type: "general_alignment"
seed: 42
device: "cuda"

# ==============================================================================
# DATA
# ==============================================================================
dataset_name: "mnist"
data_path: "./data"
batch_size: 512
num_workers: 4

# ==============================================================================
# MODEL
# ==============================================================================
model_name: "mlp"
model_config:
  hidden_sizes: [128, 64]  # MLP layers
  activation: "relu"
  dropout_rate: 0.0

# For CNNs (when model_name is cnn/resnet):
# model_config:
#   num_conv_layers: 3
#   channels: [32, 64, 128]
#   cnn_mode: "unfold"  # How to compute alignment for conv layers

# ==============================================================================
# TRAINING - FIXED: All parameters now under 'training:' section
# ==============================================================================
training:
  epochs: 10  # Train the model first (IMPORTANT!)
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "cosine"
  scheduler_config:
    T_max: 10

# ==============================================================================
# ALIGNMENT ANALYSIS
# ==============================================================================
# Metrics to compute
metrics: ["rayleigh_quotient"]

# When to measure alignment
measure_alignment_during_training: true
alignment_frequency: 1  # Every N epochs

# Layer selection
tracked_layers: null  # null = all layers
exclude_classification_layer: true

# ==============================================================================
# PRUNING EXPERIMENTS 
# ==============================================================================
# Choose what type of pruning experiment to run
# TIP: Enable performance optimizations below to speed up experiments!

# OPTION 1: Analysis Mode (temporary masking to study effects)
# Uses dropout_rates - neurons are temporarily masked then restored
# Purpose: Research to understand which neurons matter for alignment
pruning_analysis:
  enabled: true  # Set to true for research analysis
  
  # Temporary masking levels to test (0.0 = no masking, 0.9 = 90% masked)
  dropout_rates: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

  # Which pruning strategy to simulate
  algorithms: ["alignment"]  # Options: magnitude, alignment, random
  selection_strategies: ["low", "high", "random"]  # Which neurons to mask: low, high, random
  # IMPORTANT: For magnitude strategy:
  #   - "low" = prune weights with LOW magnitude (keep high magnitude)
  #   - "high" = prune weights with HIGH magnitude (keep low magnitude) 
  #   - "random" = prune random weights (ignore magnitude)
  # For random strategy: selection_strategies is ignored (always random)
  # For alignment strategy: uses alignment scores instead of magnitude
  
  # How to apply masking
  analysis_level: "per_layer"  # per_layer, global, cascading
  structured: true  # Mask entire neurons (true) or individual weights (false)
  
  # Fine-tuning to measure recovery potential
  fine_tune_after_analysis: true  # Whether to fine-tune after masking
  fine_tune_epochs: 10             # How many epochs to fine-tune
  fine_tune_learning_rate: 0.0001 # Lower LR for fine-tuning (usually 1/10 of training LR)
  
  # Statistical robustness
  num_random_trials: 3

# OPTION 2: Compression Mode (permanent pruning to create smaller networks)  
# Uses target_sparsity_levels - neurons are permanently removed
# Purpose: Create deployable compressed models
network_compression:
  enabled: false  # Set to true for actual model compression
  
  # Permanent pruning levels to test (0.1 = remove 10%, 0.9 = remove 90%)
  target_sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  
  # Which pruning strategy to use
  algorithms: ["magnitude"]  # Options: magnitude, alignment, random
  selection_strategy: "low"  # Which neurons to remove: low, high, random
  
  # How to apply pruning
  compression_level: "per_layer"  # per_layer, global, cascading  
  structured: true  # Remove entire neurons (true) or individual weights (false)
  
  # Recovery training after pruning
  fine_tune_after_compression: true
  fine_tune_epochs: 5
  fine_tune_learning_rate: 0.0001
  
  # Output control
  return_compressed_networks: false  # Whether to save the compressed models
  save_compression_masks: true       # Save pruning masks for reproducibility
  export_onnx: false                 # Export to ONNX format for deployment

# ==============================================================================
# SIMPLE EXPLANATION:
# - Enable pruning_analysis for research (temporary masking with dropout_rates)
# - Enable network_compression for deployment (permanent pruning with sparsity_levels)  
# - Don't enable both at the same time - pick one based on your goal
# ==============================================================================

# ==============================================================================
# MULTI-NETWORK EXPERIMENTS
# ==============================================================================
num_networks: 10  # Set >1 for multi-network analysis
aggregate_metrics: true
save_individual_networks: false

# ==============================================================================
# PERFORMANCE OPTIMIZATION
# ==============================================================================
# Speed vs memory trade-offs for faster experiments
#
# QUICK SETTINGS:
# - For normal use: use_tensorized_* = true, use_optimized_* = true, ultra_fast = false
# - For maximum speed: all = true (requires lots of memory)
# - Total speedup possible: 5-10x
#
# IMPORTANT: These settings significantly affect experiment runtime!

# Level 1: Tensorized operations (recommended - always enable)
# Processes multiple networks in batches instead of sequentially
# Speed: 2-3x faster, Memory: moderate increase
use_tensorized_training: true  # For training phase
use_tensorized_pruning: true   # For pruning experiments

# Level 2: Optimized implementation (recommended)
# Enhanced tensorized operations with reduced memory copying
# Speed: 1.5-2x faster than tensorized, Memory: same as tensorized
use_optimized_pruning: true

# Level 3: Ultra-fast mode (use with caution)
# Creates network copies for all pruning configurations
# Speed: 1.5-3x faster than optimized, Memory: very high
# Only enable if you have >16GB GPU memory and need maximum speed
use_ultra_fast_pruning: true

# Additional performance settings
parallel_batch_size: null  # Batch size for parallel training (null = use batch_size)

# ==============================================================================
# OUTPUT & VISUALIZATION
# ==============================================================================
output_dir: "./results"
save_checkpoints: false
generate_plots: true
generate_html_report: false
generate_markdown_report: true

# Logging
log_interval: 100
log_level: "INFO" 