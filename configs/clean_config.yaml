# Clean Configuration for Alignment Analysis
# This is a streamlined config focusing on essential parameters

# ==============================================================================
# EXPERIMENT IDENTIFICATION
# ==============================================================================
experiment_name: "alignment_analysis"
experiment_type: "general_alignment"
seed: 42
device: "cuda"

# ==============================================================================
# DATA
# ==============================================================================
dataset_name: "mnist"
data_path: "./data"
batch_size: 512
num_workers: 4

# ==============================================================================
# MODEL
# ==============================================================================
model_name: "mlp"
model_config:
  hidden_sizes: [512, 256, 128]  # MLP layers
  activation: "relu"
  dropout_rate: 0.0

# For CNNs (when model_name is cnn/resnet):
# model_config:
#   num_conv_layers: 3
#   channels: [32, 64, 128]
#   cnn_mode: "unfold"  # How to compute alignment for conv layers

# ==============================================================================
# TRAINING
# ==============================================================================
training_epochs: 10
learning_rate: 0.001
optimizer: "adam"
scheduler: "cosine"
scheduler_config:
  T_max: 10

# ==============================================================================
# ALIGNMENT ANALYSIS
# ==============================================================================
# Metrics to compute
metrics: ["rayleigh_quotient"]

# When to measure alignment
measure_alignment_during_training: true
alignment_frequency: 1  # Every N epochs

# Layer selection
tracked_layers: null  # null = all layers
exclude_classification_layer: true

# ==============================================================================
# PRUNING EXPERIMENTS
# ==============================================================================
# Dropout analysis (progressive dropout)
dropout_rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
dropout_mode: "scaled"  # How to apply dropout
num_random_trials: 3    # Trials for random dropout

# Pruning analysis
pruning_experiments:
  enabled: true
  sparsity_levels: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
  algorithms: ["alignment"]  # Options: alignment, magnitude, random, hybrid
  selection_mode: ["low", "high", "random"]  # Which neurons to prune
  scope: "layer"  # Options: layer, global, cascading
  structured: true  # Prune entire neurons (true) or individual weights (false)
  
  # Fine-tuning
  fine_tune_after_pruning: true
  fine_tune_epochs: 5

# ==============================================================================
# MULTI-NETWORK EXPERIMENTS
# ==============================================================================
num_networks: 1  # Set >1 for multi-network analysis
aggregate_metrics: true
save_individual_networks: false

# ==============================================================================
# OUTPUT & VISUALIZATION
# ==============================================================================
output_dir: "./results"
save_checkpoints: false
generate_plots: true
generate_html_report: false
generate_markdown_report: true

# Logging
log_interval: 100
log_level: "INFO" 