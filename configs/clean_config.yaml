# Clean Configuration for Alignment Analysis
# This is a streamlined config focusing on essential parameters

# ==============================================================================
# EXPERIMENT IDENTIFICATION
# ==============================================================================
experiment_name: "alignment_analysis"
experiment_type: "general_alignment"
seed: 42
device: "cuda"

# ==============================================================================
# DATA
# ==============================================================================
dataset_name: "mnist"
data_path: "./data"
batch_size: 512
num_workers: 4

# ==============================================================================
# MODEL
# ==============================================================================
model_name: "mlp"
model_config:
  hidden_sizes: [512, 256, 128]  # MLP layers
  activation: "relu"
  dropout_rate: 0.0

# For CNNs (when model_name is cnn/resnet):
# model_config:
#   num_conv_layers: 3
#   channels: [32, 64, 128]
#   cnn_mode: "unfold"  # How to compute alignment for conv layers

# ==============================================================================
# TRAINING
# ==============================================================================
training_epochs: 10
learning_rate: 0.001
optimizer: "adam"
scheduler: "cosine"
scheduler_config:
  T_max: 10

# ==============================================================================
# ALIGNMENT ANALYSIS
# ==============================================================================
# Metrics to compute
metrics: ["rayleigh_quotient"]

# When to measure alignment
measure_alignment_during_training: true
alignment_frequency: 1  # Every N epochs

# Layer selection
tracked_layers: null  # null = all layers
exclude_classification_layer: true

# ==============================================================================
# PRUNING ANALYSIS (Research - temporary masking to study effects)
# ==============================================================================
pruning_analysis:
  enabled: true
  
  # Dropout rates for temporary masking analysis
  dropout_rates: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
  dropout_mode: "scaled"  # How to apply temporary masking
  
  # Pruning algorithms to study
  algorithms: ["alignment"]  # Options: alignment, magnitude, random, hybrid
  selection_strategies: ["low", "high", "random"]  # Which neurons to mask
  
  # Analysis scope - more intuitive names
  analysis_level: "per_layer"  # Options: per_layer, global, cascading
  # per_layer: Analyze each layer independently
  # global: Analyze across all layers jointly  
  # cascading: Analyze layer-by-layer with cumulative effects
  
  # Structure
  structured: true  # Mask entire neurons (true) or individual weights (false)
  
  # Random trials for statistical significance
  num_random_trials: 3
  
  # What to analyze
  compute_alignment_changes: true
  compute_performance_impact: true
  save_analysis_results: true

# ==============================================================================
# NETWORK COMPRESSION (Production - create smaller networks)
# ==============================================================================
network_compression:
  enabled: false  # Disabled by default since this is for analysis
  
  # Sparsity levels for actual compression
  target_sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.9]
  
  # Compression algorithms
  algorithms: ["alignment"]  # Options: alignment, magnitude, random, hybrid
  selection_strategy: "low"  # Which neurons to prune permanently
  
  # Compression scope
  compression_level: "per_layer"  # Options: per_layer, global, cascading
  
  # Structure
  structured: true  # Remove entire neurons (true) or individual weights (false)
  
  # Post-compression fine-tuning
  fine_tune_after_compression: true
  fine_tune_epochs: 5
  fine_tune_learning_rate: 0.0001  # Often needs lower LR
  
  # Output options
  return_compressed_networks: false  # Whether to save compressed models
  save_compression_masks: true       # Save masks for reproducibility
  export_onnx: false                 # Export to ONNX format
  benchmark_compressed_models: true  # Test inference speed/accuracy

# ==============================================================================
# MULTI-NETWORK EXPERIMENTS
# ==============================================================================
num_networks: 1  # Set >1 for multi-network analysis
aggregate_metrics: true
save_individual_networks: false

# ==============================================================================
# OUTPUT & VISUALIZATION
# ==============================================================================
output_dir: "./results"
save_checkpoints: false
generate_plots: true
generate_html_report: false
generate_markdown_report: true

# Logging
log_interval: 100
log_level: "INFO" 