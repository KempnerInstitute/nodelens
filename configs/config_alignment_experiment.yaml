# Alignment Experiment Configuration
# This configuration file defines parameters for neural network alignment experiments
# that analyze the relationship between alignment, dropout, and network performance.

# Experiment metadata
experiment_type: "progressive_dropout" # Type of experiment to run (options: "alignment", "progressive_dropout", "eigenvector_dropout")
results_path: "results" # Base path for saving results (can be relative or absolute path)
use_timestamp: true # Whether to include timestamp in result paths for unique experiment tracking
debug_mode: false  
     
# Core execution options
device: "cuda" # Device to run on (options: "cuda", "cpu", or specific GPU like "cuda:0")
no_save: false # If true, don't save any results to disk (useful for debug runs)
just_plot: false # If true, only load and plot existing results without running experiments
save_networks: true # Whether to save trained network checkpoints for later use
show_all: false # Whether to display all plots during execution (vs. just saving them)

# Dataset configuration
dataset:
  dataset_name: "MNIST" # Name of the dataset to use (options: "MNIST", "CIFAR10", "CIFAR100")
  data_path: "data" # Path to dataset files
  batch_size: 1024 # Batch size for training and evaluation (higher values use more memory but train faster)
  num_workers: 4

# Model configuration
model:
  model_name: "MLP"  # Or "MLP", "AlexNet"
  # Common parameters
  output_dim: 10       # MNIST/CIFAR10 classes
  dropout_rate: 0.0    # Changed from 0.5 to 0.0 as a more typical default for base model before pruning.
  # alignment_layers:  # Optional: Uncomment and define if you want to override defaults
  #   "conv1.0": 0
  #   "conv2.0": 1
  #   "fc_layers.1": 2
  #   "fc_layers.4": 3

  # MLP specific (these are ignored if model_name is not MLP, but good to have defaults)
  input_dim: 784       # Used by MLP (e.g., MNIST). For CNN, in_channels is used.
  hidden_dims: [128, 64] # Used by MLP
  activation: "relu"     # For MLP: "relu", "tanh", "sigmoid", "identity"

  # CNN2P2 specific (used if model_name is CNN2P2)
  in_channels: 1       # 1 for MNIST, 3 for CIFAR10/100
  conv_channels: [32, 64]
  kernel_sizes: [5, 5]
  strides: [1, 1]        # Strides for conv layers
  paddings: [2, 2]       # Padding for conv layers (k=5,s=1,p=2 keeps size same)
  pool_kernel_size: 2
  pool_stride: 2
  hidden_fc_dim: 128
  example_input_hw: [28, 28] # [Height, Width] e.g., [28,28] for MNIST, [32,32] for CIFAR

  # AlexNet specific: output_dim is used as num_classes.
  # dropout_rate can override internal AlexNet dropout if different from 0.5.

  # extra_model_params: {} # For any other params not explicitly listed, passed as **kwargs

# Training configuration
training:
  epochs: 10 # Number of training epochs (more epochs can improve performance but take longer)
  replicates: 5 # Number of network replicates to run for statistical analysis
  optimizer: "Adam" # Optimizer to use (options: "Adam", "SGD", "RMSprop")
  learning_rate: 0.001 # Learning rate for optimizer (typical range: 1e-4 to 1e-2)
  momentum: 0.9 # Momentum parameter for SGD (not used for Adam)
  loss: "cross_entropy" # Loss function to use for training
  training_method: "auto" # MOVED HERE from extra/execution
  
# Checkpointing configuration
checkpointing:
  save_checkpoints: false # Whether to save training checkpoints to disk
  checkpoint_frequency: 1 # How often to save checkpoints (in epochs, 1 means every epoch)
  use_wandb: true # Whether to use Weights & Biases for experiment tracking and visualization
  load_checkpoint: false # Whether to load from previous checkpoint (for resuming training)
  save_model: true # Whether to save the final trained models
  save_interval: 1 # How often to save model (in epochs)
  
# Alignment & Pruning Configuration (Maps to AlignmentConfig in config.py)
alignment: # Renamed from 'pruning' to match config.alignment attribute
  metric: "RQ"
  # run_progressive & run_eigenvector are for experiment_type logic, but belong with alignment settings
  run_progressive: true 
  run_eigenvector: false
  dropout_min: 0.0 
  dropout_max: 0.9 
  dropout_steps: 10 
  scale_by_norm: false # For RQ metric calculation

  # Pruning execution options (previously in extra, now part of AlignmentConfig)
  dropout_mode: "scaled"
  dropout_pruning_mode: "global_joint"
  exclude_classification_layer: true
  use_multi_strategy_dropout: true # For progressive_dropout: runs strategies efficiently

  # CNN processing for metrics (previously in extra, now part of AlignmentConfig)
  cnn_mode: "unfold"

# Other Miscellaneous Execution Options (Maps to ExtraConfig in config.py)
extra: # Renamed back from other_execution_options to match ExtraConfig attribute
  log_frequency: 1 
  log_images: true 
  detailed_logging: true
  # dummy_extra_param: null # Example if ExtraConfig had a field for this

# Experiment name for identification
experiment_name: "layer_wise_pruning_test" # Descriptive name for this experiment
wandb_project: "neural_alignment" # Weights & Biases project name
wandb_entity: houman_safaai@harvaard.edu # Weights & Biases entity (team or username), set to null for default 