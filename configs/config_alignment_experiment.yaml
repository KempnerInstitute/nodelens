# Alignment Experiment Configuration
# This configuration file defines parameters for neural network alignment experiments
# that analyze the relationship between alignment, dropout, and network performance.

# -----------------------------------------------------------------------------
# I. Experiment Metadata & Core Execution
# -----------------------------------------------------------------------------
experiment_name: "mlp_mnist_global_joint_test_callback_test" # MODIFIED: Added callback_test for clarity
experiment_type: "progressive_dropout"    # Options: 
                                        #   "progressive_dropout" - Prunes nodes iteratively and measures performance.
                                        #   "eigenvector_dropout" - Prunes based on eigenvectors of alignment metric.
                                        #   "alignment_analysis"  - Runs both progressive and (if configured) eigenvector dropout.
                                        #   "layer_isolated_pruning" - Prunes/evaluates one layer at a time (generates N plots).
results_path: "results"                   # Base path for saving all outputs.
use_timestamp: true                     # If true, appends a YYYYMMDD_HHMMSS timestamp to `results_path`.
debug_mode: true                       # MODIFIED: Set to true for testing callbacks

device: "cuda"                          # "cuda", "cuda:0", "cpu".
save_networks: true                     # If true, final trained/pruned network models are saved.
no_save: false                          # Master switch: if true, nothing is saved to disk.
just_plot: false                        # If true, loads existing results and only generates plots.
show_all: false                         # If true, matplotlib plots will be displayed interactively.
seed: 422                              # MODIFIED: Set a seed for reproducibility during testing

# -----------------------------------------------------------------------------
# II. Dataset Configuration
# -----------------------------------------------------------------------------
# Maps to DatasetConfig in config.py
dataset:
  dataset_name: "MNIST"                 # Options: "MNIST", "CIFAR10", "CIFAR100", "ImageNet".
  data_path: "data"                     # Root directory for dataset files.
  batch_size: 1024                      # Batch size for DataLoaders.
  num_workers: 4                        # Number of worker processes for DataLoader.

# -----------------------------------------------------------------------------
# III. Model Configuration
# -----------------------------------------------------------------------------
# Maps to ModelConfig in config.py
model:
  model_name: "MLP"                     # Registered model name. Options: "MLP", "CNN2P2", "AlexNet".
  output_dim: 10                        # Number of output classes.
  dropout_rate: 0.0                     # Dropout for nn.Dropout layers in model constructor (usually 0.0 for pruning experiments).

  # MLP Specific (used if model_name: "MLP")
  input_dim: 784
  hidden_dims: [128, 64]
  activation: "relu"                    # Options: "relu", "tanh", "sigmoid", "identity".

  # CNN2P2 Specific (used if model_name: "CNN2P2")
  in_channels: 1
  conv_channels: [32, 64]
  kernel_sizes: [5, 5]
  strides: [1, 1]
  paddings: [2, 2]
  pool_kernel_size: 2
  pool_stride: 2
  hidden_fc_dim: 128
  example_input_hw: [28, 28]
 
  # Optional: Specify layers for AlignmentNetwork. If None, defaults in models.py are used.
  # Names must match base_model.named_modules(). Values are arbitrary unique IDs for AlignmentNetwork.
  alignment_layers: null 
  #   "network.0": 0
  #   "conv1.0": 0 

  extra_model_params: {}                # For other kwargs to pass to base model constructor.

# -----------------------------------------------------------------------------
# IV. Training Configuration
# -----------------------------------------------------------------------------
# Maps to TrainingConfig in config.py
training:
  epochs: 5  # MODIFIED: Reduced epochs for faster testing
  replicates: 1 # MODIFIED: Reduced replicates for faster testing
  optimizer: "Adam"                     # Options: "Adam", "SGD", "RMSprop", "AdamW" (case-sensitive).
  learning_rate: 0.001
  momentum: 0.9                         # For SGD.
  loss: "cross_entropy"                 # Currently nn.CrossEntropyLoss used internally.
  training_method: "auto"               # Method for training multiple replicates:
                                        #   "auto": Chooses "fully_tensorized" if architectures are same, else "sequential".
                                        #   "sequential": Train one by one.
                                        #   "fully_tensorized": Train all as a single ensemble (fastest).

# -----------------------------------------------------------------------------
# V. Alignment Metric Calculation Settings
# -----------------------------------------------------------------------------
# Maps to alignment_settings: AlignmentConfig in config.py
alignment_settings:
  metric: "RQ"                          # Alignment metric to use. Options: "RQ", "NullSpace", "MI", "WeightSimilarity", "NodeRedundancy", "RankAlignment".
  scale_by_norm: false                  # For RQ metric: if true, scales input covariance matrix by its norm.
  cnn_mode: "batch_patch_combined"                    # How CNN features are processed for metrics. Options:
                                        #   "unfold": Uses `torch.nn.functional.unfold` to create patches, then flattens.
                                        #   "patchwise": Processes each patch separately.
                                        #   "batch_patch_combined": Combines batch and patch dimensions after unfolding.
  # Flags for experiment_type: "alignment_analysis"
  run_progressive: true                 # If true and exp_type="alignment_analysis", run progressive dropout part.
  run_eigenvector: false                # If true and exp_type="alignment_analysis", run eigenvector dropout part.
  # NEW: Callbacks for tracking alignment metrics during training
  callbacks: {}
    # alignment_metrics:
    #   - name: "RQ"             # Metric to track (must be a valid metric name)
    #     num_batches: 3       # Number of batches from test_loader to use for this metric per epoch
    #   - name: "MI"             # Another metric to track
    #     num_batches: 3
      # - name: "RankAlignment" # Example for another metric
      #   num_batches: 3 
      
# -----------------------------------------------------------------------------
# VI. Pruning Experiment Settings
# -----------------------------------------------------------------------------
# Maps to pruning_settings: PruningConfig in config.py
pruning_settings:
  dropout_min: 0.0
  dropout_max: 0.9
  dropout_steps: 30 # MODIFIED: Reduced steps for faster testing
  
  dropout_mode: "scaled"                # How weights are treated after pruning nodes/connections:
                                        #   "scaled": Remaining weights are scaled by 1/(1-p) (Inverted Dropout principle).
                                        #   "unscaled" (or "zero"): Weights are simply zeroed out.
                                
  dropout_pruning_mode: "layer_wise"  # Strategy for distributing pruning across layers:
                                        #   "global_joint": Considers all nodes from all prunable layers together. Ranks globally by score and prunes top X% overall.
                                        #   "layer_wise": Prunes X% from *each* prunable layer independently, based on scores within that layer.
                                        #   "layer_isolated": (For experiment_type="layer_isolated_pruning") Prunes X% in one layer, evaluates, restores, then moves to next layer.
                                        #   "cascading_layer": Prunes L1, its output influences pruning of L2, etc. (Note: current batched impl. has limitations).
  
  exclude_classification_layer: true    # If true, the final classification layer is not pruned.
  
  use_multi_strategy_dropout: false      # MODIFIED: Set to false for simpler sequential callback logic during this test.
                                        #   If true, processes high_rq, low_rq, random strategies more efficiently together for each network replicate.
                                        #   If false, strategies are processed sequentially for each replicate.

# -----------------------------------------------------------------------------
# VII. Checkpointing & Logging Configuration
# -----------------------------------------------------------------------------
# Maps to checkpointing: CheckpointingConfig in config.py
checkpointing:
  save_checkpoints: false
  checkpoint_frequency: 1
  load_checkpoint: false

# Maps to wandb: WandbConfig (if you create this dataclass in config.py) or loaded as dict
wandb:
  use_wandb: true
  wandb_project: "neural_alignment"
  wandb_entity: "your_wandb_entity"

# Maps to extra: ExtraConfig in config.py
extra:
  log_frequency: 1
  log_images: true
  detailed_logging: true
  # dummy_extra_param: null 