# Replaceability-Learning-Rules: paper-artifact data manifest
#
# This file records the canonical on-disk location, byte size, and SHA-256
# checksum of paper-artifact CSVs that exceed the alignment repo's 500 KB
# pre-commit size guard. These files are gitignored (see ../.gitignore) and
# are NOT recoverable from a fresh `git clone` alone. They must either be
# fetched from kempner shared storage or re-derived from the per-run training
# outputs in `results/learning_rules/`.
#
# Schema (per entry):
#   path:           repo-relative file path
#   size_bytes:     size in bytes
#   sha256:         SHA-256 checksum (hex)
#   canonical:      shared-storage absolute path (Kempner cluster)
#   produced_by:    script that generated this file (path inside this repo)
#   regenerate:     command that re-derives the file from the run outputs
#   notes:          provenance / interpretation
#
# Maintenance:
#   - When a CSV is regenerated, update size_bytes, sha256, and any path
#     suffix that encodes a date.
#   - To verify a local copy matches the manifest, run:
#       sha256sum -c <(yq -r '.entries[] | "\(.sha256)  \(.path)"' data_manifest.yaml)

