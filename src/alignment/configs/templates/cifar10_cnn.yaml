# Configuration template for CNN experiments on CIFAR-10
name: cifar10_cnn_experiment
description: Layer-isolated pruning experiment with CNN on CIFAR-10

# Model configuration
model_name: cnn2p2
model_config:
  in_channels: 3
  conv_channels: [32, 64]
  kernel_sizes: [5, 5]
  strides: [1, 1]
  paddings: [2, 2]
  pool_kernel_size: 2
  pool_stride: 2
  hidden_fc_dim: 256
  dropout_rate: 0.3
  output_dim: 10
  example_input_hw: [32, 32]

# Dataset configuration
dataset_name: cifar10
dataset_config:
  data_path: ${DATA_PATH:./data}
  augmentation: true
  normalize: true

# Training configuration
batch_size: 64
num_workers: 8
device: ${DEVICE:cuda}
seed: 42
train_before_dropout: true
training_epochs: 20
learning_rate: 0.001
optimizer: adamw

# Metrics configuration
metrics:
  - rayleigh_quotient
  - cka
  - mutual_information
metric_configs:
  rayleigh_quotient:
    scale_by_norm: false
    aggregation_op: mean
    force_cpu: true
  cka:
    kernel: linear
    threshold: 0.01
  mutual_information:
    estimation_method: gaussian
    num_samples: 1000

# Experiment-specific configuration
pruning_percentages: [0.1, 0.3, 0.5, 0.7, 0.9]
tracked_layers: ["conv1.0", "conv2.0", "fc_layers.2", "fc_layers.5"]

# Checkpointing and logging
checkpoint_dir: ${CHECKPOINT_DIR:./checkpoints/cifar10_cnn}
checkpoint_interval: 500
save_best: true
log_dir: ${LOG_DIR:./logs/cifar10_cnn}
log_interval: 50

# Optional: Weights & Biases
wandb_project: alignment-studies
wandb_entity: null 