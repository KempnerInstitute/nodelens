# Example configuration with tensorized training options
experiment_type: "progressive_dropout"
experiment_name: "Tensorized Training Example"
use_timestamp: true
device: "cuda"

# Dataset configuration
dataset:
  dataset_name: "MNIST"
  batch_size: 128
  data_path: "./data"

# Model configuration
model:
  model_name: "MLP"
  dropout_rate: 0.0

# Training configuration
training:
  epochs: 5
  replicates: 10  # Number of network copies to train
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: "Adam"
  train_before_dropout: true

# Alignment configuration
alignment:
  metric: "RQ"
  run_progressive: true
  run_eigenvector: false
  dropout_min: 0.0
  dropout_max: 0.95
  dropout_steps: 20

# Extra configuration options
extra:
  dropout_mode: "scaled"
  dropout_pruning_mode: "global_joint"
  exclude_classification_layer: true
  # Available training methods: "auto", "sequential", "tensorized", "fully_tensorized"
  training_method: "fully_tensorized"  # Using the fastest method

# Checkpoint configuration
checkpointing:
  save_checkpoints: false
  use_wandb: false 