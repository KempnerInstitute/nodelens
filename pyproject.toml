[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment"
version = "0.2.0"
description = "Loss-sensitive neural network analysis and structured pruning tools."
authors = [
    { name = "Research and Engineering at Kempner Institute", email = "kempner-research-engineering@g.harvard.edu" },
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "omegaconf",
    "seaborn",
    "matplotlib",
    "tqdm",
    "pandas",
    "scipy",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["alignment*"]


[project.optional-dependencies]
dev = [
    "ruff",
    "mypy>=1.0,<1.17",
    "black>=24.0",
    "isort>=5.12,<6.1",
    "pytest",
    "pytest-sphinx",
    "twine>=1.11.0",
    "setuptools",
    "wheel",
    "build",
]
train = [
    "wandb",
    "beaker-gantry",
    "click",
    "torchmetrics",
    "smashed[remote]>=0.21.1",
    "safetensors",
    "datasets",
    "scikit-learn",
    "msgspec>=0.14.0",
]
all = [
    "alignment[dev,train]",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-napoleon",
    "myst-parser",
    "nbsphinx",
    "recommonmark",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",

]


[project.urls]
Homepage = "https://github.com/KempnerInstitute/alignment"
Repository = "https://github.com/KempnerInstitute/alignment"
Documentation = "https://github.com/KempnerInstitute/alignment#readme"
Artifacts = "https://huggingface.co/datasets/hsafaai/supernodes-scar-artifacts"

[tool.black]
line-length = 150

[tool.isort]
profile = "black"
line_length = 150

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-ignore = ["E402", "E721", "E722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__ files (used for exports)
"src/alignment/external/**" = ["E721", "E722"]  # Allow in external code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
    "paper_critical: marks tests for paper-critical modules",
]
