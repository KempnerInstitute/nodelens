site_name: Network Alignment Analysis
site_description: Documentation for neural network alignment analysis tools
repo_url: https://github.com/your-username/alignment
edit_uri: edit/main/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: 'index.md'
  - Documentation:
    - Overview: 'documentation.md'
    - Metrics: 'metrics/README.md'
    - Experiment Framework: 'experiment/README.md'
    - Performance Optimizations: 'performance/README.md'
    - API Reference: 'api/README.md'
    - Tensorized Implementations: 'tensorized/README.md'
  - Guides:
    - Usage Guide: 'usage.md'
    - Configuration Reference: 'configuration.md'
    - Pruning Modes: 'pruning_modes.md'
    - Background: 'background.md'
    - Development Roadmap: 'roadmap.md'
  - Summaries:
    - Documentation Reorganization: 'summaries/documentation_summary.md'
    - Codebase Cleanup: 'summaries/codebase_cleanup_summary.md'
    - Metrics Refactoring: 'summaries/metrics_refactoring_summary.md'

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js 